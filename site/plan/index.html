<script type="module">
// SPDX-License-Identifier: GPL-3.0-only
// Copyright (C) 2026 Leo Kuroshita (@kurogedelic), Hügelton Instruments
//
// FM-1 .fwsc packages in the browser: the package identity and the image the
// device reads during an update.

const BLOCKS = 20, BLK = 0x30, KEEP = 0x2F;
const STOCK_V15_SHA256 = "db1642b2b6fa5c2cccb11ffd13878068bb28601678d3644049f99dc40e7edb8a";
const STOCK_APP_SIZE = 0x8DFBC;
const STOCK_V15_SIZE = 699956;

const T = new Uint16Array(256);
for (let i = 0; i < 256; i++) {
  let c = i << 8;
  for (let k = 0; k < 8; k++) c = c & 0x8000 ? (c << 1) ^ 0x1021 : c << 1;
  T[i] = c & 0xFFFF;
}

function crc16(d, crc = 0) {
  for (let i = 0; i < d.length; i++) crc = ((crc << 8) & 0xFFFF) ^ T[((crc >> 8) ^ d[i]) & 0xFF];
  return crc;
}

function enc(buf, off, size, key = 0xFFFF) {
  if (off < 0 || size < 0 || off + size > buf.length) throw new Error("package field out of bounds");
  for (let i = 0; i < size; i++) {
    buf[off + i] ^= key & 0xFF;
    key = ((key * 2) ^ (key & 0x8000 ? 0x1021 : 0)) & 0xFFFF;
  }
}

function sfc(buf, off, size, base, key) {
  for (let i = 0; i < size; i += 32) enc(buf, off + i, Math.min(size - i, 32), key ^ ((off + i - base) >> 2));
}

function chipkeyDecode(d) {
  let sum = 0;
  for (let i = 0; i < 16; i++) sum += d[i];
  sum &= 0xFF;
  sum = sum >= 0xE0 ? 0xAA : sum <= 0x10 ? 0x55 : sum;
  let k = 0;
  for (let i = 0; i < 16; i++) if ((d[16 + i] ^ d[15 - i]) < sum) k |= 1 << i;
  return k;
}

const align32 = (v) => (v + 31) & ~31;
const u16 = (b, o) => b[o] | (b[o + 1] << 8);
const u32 = (b, o) => (b[o] | (b[o + 1] << 8) | (b[o + 2] << 16) | (b[o + 3] << 24)) >>> 0;
function w16(b, o, v) { b[o] = v & 0xFF; b[o + 1] = (v >> 8) & 0xFF; }
function w32(b, o, v) { w16(b, o, v & 0xFFFF); w16(b, o + 2, (v >>> 16) & 0xFFFF); }

class Entry {                                   // JLFS head, 32 bytes
  constructor(raw, off) {
    if (!Number.isInteger(off) || off < 0 || off + 32 > raw.length)
      throw new Error(`JLFS header out of bounds @${off}`);
    this.hdrOff = off;
    this.hcrc = u16(raw, off);
    this.dcrc = u16(raw, off + 2);
    this.offset = u32(raw, off + 4);
    this.size = u32(raw, off + 8);
    this.flags = raw[off + 12];
    this.resvd = raw[off + 13];
    this.index = u16(raw, off + 14);
    this.rawName = raw.slice(off + 16, off + 32);
    const z = this.rawName.indexOf(0);
    this.name = String.fromCharCode(...this.rawName.slice(0, z < 0 ? 16 : z));
    if (crc16(raw.subarray(off + 2, off + 32)) !== this.hcrc) throw new Error(`JLFS header CRC mismatch @${off.toString(16)}`);
  }
  packInto(buf) {
    const o = this.hdrOff;
    w16(buf, o + 2, this.dcrc); w32(buf, o + 4, this.offset); w32(buf, o + 8, this.size);
    buf[o + 12] = this.flags; buf[o + 13] = this.resvd; w16(buf, o + 14, this.index);
    buf.set(this.rawName, o + 16);
    this.hcrc = crc16(buf.subarray(o + 2, o + 32));
    w16(buf, o, this.hcrc);
  }
}

class Package {
  constructor(bytes) {
    this.raw = new Uint8Array(bytes);
    this.parseUfw();
    this.flash = this.raw.slice(this.flashFileOff, this.flashFileOff + this.flashSize);
    this.parseFlash();
  }

  get product() { return productOf(this.raw); }

  setProduct(name) {
    if (name.length > BLOCKS) throw new Error("product name too long");
    for (let i = 0; i < BLOCKS; i++) {
      const m = i < name.length ? (name.charCodeAt(i) + i + 1) & 0xFF : 0x7D;
      if (i < name.length && m === 0x7D) throw new Error("product name encodes to the unused marker");
      this.raw[i * BLK + KEEP] = m;
    }
  }

  headerBytes() {
    const h = new Uint8Array(BLOCKS * KEEP);
    for (let i = 0; i < BLOCKS; i++) h.set(this.raw.subarray(i * BLK, i * BLK + KEEP), i * KEEP);
    return h;
  }

  hdrFileOff(i) { return Math.floor(i / KEEP) * BLK + (i % KEEP); }

  parseUfw() {
    /* (QG-1 stage 2) a file shorter than the 20 blocks the identity lives in cannot be a package:
     * headerBytes() would read an empty tail and all-zero CRCs would compare equal */
    if (this.raw.length < BLOCKS * BLK) throw new Error("not an FM-1 package (too short)");
    const h = this.headerBytes();
    enc(h, 0, 0x40);
    const hcrc = u16(h, 0), lcrc = u16(h, 2), nent = u16(h, 8);
    if (crc16(h.subarray(2, 0x40)) !== hcrc) throw new Error("not an FM-1 .fwsc (UFW header CRC mismatch)");
    this.skew = BLOCKS * BLK - h.length;
    this.ufw = h;
    this.nent = nent;
    const hsize = 0x40 + nent * 0x50;
    if (hsize > h.length) throw new Error("UFW entry list is larger than the header");
    if (crc16(h.subarray(0x40, hsize)) !== lcrc) throw new Error("UFW entry list CRC mismatch");
    this.entries = [];
    for (let off = 0x40; off < hsize; off += 0x50) {
      const e = h.slice(off, off + 0x50);
      enc(e, 0, 0x50);
      const z = e.subarray(0x40, 0x50).indexOf(0);
      this.entries.push({ off, type: u16(e, 0), dcrc: u16(e, 4), dataOff: u32(e, 8), size: u32(e, 12),
        name: String.fromCharCode(...e.subarray(0x40, z < 0 ? 0x50 : 0x40 + z)), plain: e });
    }
    const fl = this.entries.find((e) => e.type === 0);
    if (!fl) throw new Error("no flash.bin in the package");
    this.flashEntry = fl;
    this.flashFileOff = fl.dataOff + this.skew;
    this.flashSize = fl.size;
    if (this.flashFileOff < 0 || this.flashFileOff + fl.size > this.raw.length)
      throw new Error("flash.bin is outside the package");
    if (crc16(this.raw.subarray(this.flashFileOff, this.flashFileOff + fl.size)) !== fl.dcrc) throw new Error("flash.bin CRC mismatch");
  }

  parseFlash() {
    if (this.flash.length < 32) throw new Error("flash image is too short");
    const dec = this.flash.slice();
    const h = dec.slice(0, 32);
    enc(h, 0, 32);
    if (crc16(h.subarray(2, 32)) !== u16(h, 0)) throw new Error("flash header CRC mismatch");
    this.chipKey = null; this.appBase = null;
    let listEnd = false;
    for (let off = 32; off + 32 <= dec.length; off += 32) {
      enc(dec, off, 32);
      const e = new Entry(dec, off);
      if (e.name === "isd_config.ini" && e.offset + 34 <= dec.length) {
        const blob = dec.subarray(e.offset, e.offset + 34);
        if (crc16(blob.subarray(0, 32)) === u16(blob, 32)) this.chipKey = chipkeyDecode(blob.subarray(0, 32));
      }
      if (e.flags === 0x81 && e.name === "app_dir_head" && e.offset + 32 <= dec.length && this.appBase === null)
        this.appBase = e.offset;
      if (e.index) { listEnd = true; break; }
    }
    if (!listEnd) throw new Error("flash entry list has no end");
    if (this.chipKey === null || this.appBase === null) throw new Error("chip key or app_dir_head not found");
    const b = this.appBase, k = this.chipKey, end = align32(b + 32);
    if (!Number.isInteger(b) || b < 0 || end > dec.length) throw new Error("app_dir_head is outside the flash");
    sfc(dec, b, end - b, b, k);
    const head = new Entry(dec, b);
    const blkEnd = b + head.size;
    if (blkEnd > dec.length) throw new Error("app area is outside the flash");
    if (blkEnd > end) sfc(dec, end, blkEnd - end, b, k);
    this.sfcEnd = Math.max(end, blkEnd);
    this.cfgLen = 0;
    const probe = this.flash.slice(b, align32(blkEnd) + 32);
    sfc(probe, 0, probe.length, 0, k);
    try {
      const cfg = new Entry(probe, blkEnd - b);
      if (cfg.name === "cfg" && blkEnd + cfg.size <= this.flash.length) this.cfgLen = cfg.size;
    } catch (_) { /* no cfg block */ }
    if (this.cfgLen) {
      const region = this.flash.slice(b, blkEnd + this.cfgLen);
      sfc(region, 0, region.length, 0, k);
      dec.set(region, b);
      this.sfcEnd = blkEnd + this.cfgLen;
    }
    this.head = head;
    this.app = null;
    let appEnd = false;
    /* (QG-1 stage 2) the app entry list lives inside the app area (head.size): the parser decrypts
     * exactly [b, blkEnd), so an entry past blkEnd is still ciphertext and can never pass its header
     * CRC. Stop there, as setApp() does, instead of walking the rest of a truncated list */
    const appLimit = Math.min(dec.length, blkEnd);
    for (let off = b + 32; off + 32 <= appLimit; off += 32) {
      const e = new Entry(dec, off);
      if (e.flags === 0x82 && e.name === "app.bin") this.app = e;
      if (e.index) { appEnd = true; break; }
    }
    if (!appEnd) throw new Error("app entry list has no end");
    if (!this.app) throw new Error("app.bin not found in app area");
    this.appOff = b + this.app.offset;
    if (this.appOff < 0 || this.appOff + this.app.size > dec.length)
      throw new Error("app.bin is outside the flash");
    this.dec = dec;
  }

  /* every file the app area declares with attr 0x82 (app.bin, cfg_tool.bin, ...), with its CRC16
   * checked against the bytes the chip key decrypts: formats.rs app_files_status does the same walk,
   * and that is the check M-Flasher makes before it writes (ops.rs plan_firmware). */
  appFiles() {
    const out = [], b = this.appBase, dec = this.dec, end = Math.min(dec.length, b + this.head.size);
    for (let off = b + 32; off + 32 <= end; off += 32) {
      let e;
      try { e = new Entry(dec, off); } catch (_) { break; }
      if (e.flags === 0x82) {
        const a = b + e.offset;
        const ok = a + e.size <= dec.length && crc16(dec.subarray(a, a + e.size)) === e.dcrc;
        out.push({ name: e.name, size: e.size, crc: e.dcrc, ok });
      }
      if (e.index) break;
    }
    return out;
  }

  // the new app, padded to the stock size (Felucca never changes the layout)
  setApp(app) {
    if (app.length > this.app.size) throw new Error(`app is ${app.length} B, the slot is ${this.app.size} B`);
    const nw = new Uint8Array(this.app.size).fill(0xFF);
    nw.set(app);
    const a = this.app, h = this.head, b = this.appBase;
    this.dec.set(nw, this.appOff);
    a.dcrc = crc16(nw);
    a.packInto(this.dec);
    h.dcrc = crc16(this.dec.subarray(h.hdrOff + 32, h.hdrOff + h.size));
    h.packInto(this.dec);
    this.sfcEnd = Math.max(align32(b + 32), b + h.size + this.cfgLen);
    const region = this.dec.slice(b, this.sfcEnd);
    sfc(region, 0, region.length, 0, this.chipKey);
    this.flash.set(region, b);
  }

  serialize() {
    const out = this.raw.slice();
    out.set(this.flash, this.flashFileOff);
    const fl = this.flashEntry, e = fl.plain.slice();
    w16(e, 4, crc16(this.flash));
    enc(e, 0, 0x50);
    const h = this.ufw.slice();
    h.set(e, fl.off);
    const hsize = 0x40 + this.nent * 0x50;
    w16(h, 2, crc16(h.subarray(0x40, hsize)));
    w16(h, 0, crc16(h.subarray(2, 0x40)));
    enc(h, 0, 0x40);
    for (let i = 0; i < hsize; i++) out[this.hdrFileOff(i)] = h[i];
    return out;
  }
}

// the package identity ("FM-1_904"): one marker byte after each of the first 20 blocks
function productOf(fwsc) {
  if (fwsc.length < BLOCKS * BLK) throw new Error("not an FM-1 package (too short)");
  let s = "";
  for (let i = 0; i < BLOCKS; i++) {
    const m = fwsc[i * BLK + KEEP];
    if (m !== 0x7D) s += String.fromCharCode((m - i - 1) & 0xFF);
  }
  return s;
}

// the image the device addresses during an update: the .fwsc without the 20 marker bytes
function logicalImage(fwsc) {
  const out = new Uint8Array(fwsc.length - BLOCKS);
  for (let i = 0; i < BLOCKS; i++) out.set(fwsc.subarray(i * BLK, i * BLK + KEEP), i * KEEP);
  out.set(fwsc.subarray(BLOCKS * BLK), BLOCKS * KEEP);
  return out;
}

async function sha256hex(bytes) {
  const d = await crypto.subtle.digest("SHA-256", bytes);
  return [...new Uint8Array(d)].map((x) => x.toString(16).padStart(2, "0")).join("");
}

// Only the user's unmodified official V15 is accepted for a return to stock.
// The digest pins every file, loader and flash layout; filenames are not evidence.
async function validateStockPackage(bytes) {
  if (bytes.length !== STOCK_V15_SIZE || await sha256hex(bytes) !== STOCK_V15_SHA256)
    throw new Error("Select the unmodified official FM-1 V15 file (FM-1.fwsc).");
  const pkg = new Package(bytes);
  if (pkg.product !== "FM-1_015" || pkg.flashFileOff !== 1044 || pkg.flashSize !== 602112 ||
      pkg.appBase !== 16384 || pkg.appOff !== 16672 || pkg.app.size !== STOCK_APP_SIZE ||
      !pkg.entries.some((e) => e.type === 100 && e.name === "ota.bin" && e.size === 19969))
    throw new Error("The official firmware has an unsupported FM-1 layout.");
  return { product: pkg.product, image: logicalImage(bytes), sha256: STOCK_V15_SHA256 };
}

// official V15 + Felucca app -> installable package (Uint8Array)
async function buildFeluccaPackage(stockBytes, appBytes, product) {
  const sha = await sha256hex(stockBytes);
  if (sha !== STOCK_V15_SHA256) throw new Error("this is not the official FM-1 V15 firmware file (FM-1.fwsc)");
  const pkg = new Package(stockBytes);
  pkg.setApp(appBytes);
  pkg.setProduct(product);
  return pkg.serialize();
}

// SPDX-License-Identifier: GPL-3.0-only
// Copyright (C) 2026 Leo Kuroshita (@kurogedelic), Hügelton Instruments
//
// Would M-Flasher install this package, and exactly which sectors will it write?
//
// The first install on a stock FM-1 is M-Flasher's `Install firmware` (docs/M-FLASHER.md §6), and its
// own conditions are what the package has to meet. They are quoted here from M-Flasher 0.9.4, tag
// `v0.9.4` (MIT, (c) jvitkauskas, https://github.com/jvitkauskas/m-flasher):
//
//   src/formats.rs  Package::parse      identity weave, header CRC16, file-list CRC16, flash.bin type 0
//                                       and CRC16, image longer than the boot area and a whole number
//                                       of 4 KiB sectors
//   src/formats.rs  app_files_status    every attr-0x82 file decrypts with the chip key and its CRC16
//                                       matches (on the unit's key: that is the chip-key refusal)
//   src/ops.rs      plan_firmware       model in the board's models, image <= 1 MiB, the write is
//                                       [0x4000, len) and no changed sector may fall outside it
//   src/boards.rs   FM1                 models ["FM-1", "MiniFM"], factory 0xFF000..0x100000
//
// The values below are computed here, in the page, from the package's bytes and -- when the owner
// loads it -- their own dump. Nothing is sent to the unit, and no step of this is M-Flasher: it is the
// check M-Flasher will make, answered before the cable is plugged in.
//
// tools/fm1_mflasher_accept.py is the same trace on the host, with the same refusal wording; the
// browser one is here so reading it needs no Python at all.


const ACCEPT_BOOT_AREA = 0x4000;      // formats.rs BOOT_AREA
const ACCEPT_SECTOR = 0x1000;         // formats.rs SECTOR
const ACCEPT_FLASH_MAX = 0x100000;    // boards.rs FLASH_SIZE
const ACCEPT_FACTORY = 0xFF000;       // boards.rs FM1.factory
const ACCEPT_MODELS = ["FM-1", "MiniFM"];
const ACCEPT_CHIP_KEY = 0x980F;       // boards.rs CHIP_KEY, and what an FM-1 record reports

/* its own name: the inlined modules share one scope (make_site refuses a duplicate declaration) */
const accU16 = (b, o) => b[o] | (b[o + 1] << 8);

/* M-Flasher's refusals, in its order. Each is { key, value }: the page translates key and prints the
 * value, so a refusal reads the way the tool reads on the owner's screen. */
function acceptance(bytes, chipKey = ACCEPT_CHIP_KEY) {
  const checks = [];
  let pkg = null;
  try {
    pkg = new Package(bytes);
  } catch (e) {
    return { ok: false, checks, pkg: null, refusal: { key: "refuseContainer", value: String((e && e.message) || e) } };
  }
  const product = pkg.product;
  const model = product.split("_")[0];
  const image = pkg.flashSize;
  checks.push({ key: "accContainer", value: product, ok: true });
  checks.push({ key: "accImage", value: `${image} B`, ok: true });
  checks.push({ key: "accHeaderCrc", value: "0x" + accU16(pkg.ufw, 0).toString(16).toUpperCase().padStart(4, "0"), ok: true });
  checks.push({ key: "accListCrc", value: `${pkg.entries.length}`, ok: true });
  checks.push({ key: "accFlashCrc", value: "0x" + pkg.flashEntry.dcrc.toString(16).toUpperCase().padStart(4, "0"), ok: true });

  if (!ACCEPT_MODELS.includes(model))
    return { ok: false, checks, pkg, refusal: { key: "refuseModel", value: model } };
  checks.push({ key: "accModel", value: model, ok: true });

  if (image > ACCEPT_FLASH_MAX)
    return { ok: false, checks, pkg, refusal: { key: "refuseSize", value: `${image} B` } };
  checks.push({ key: "accSize", value: `${image} B <= ${ACCEPT_FLASH_MAX} B`, ok: true });

  const app = pkg.appFiles();
  const bad = app.filter((f) => !f.ok);
  for (const f of app) checks.push({ key: "accAppFile", value: `${f.name} ${f.size} B 0x${f.crc.toString(16).toUpperCase()}`, ok: f.ok });
  if (!app.length)
    return { ok: false, checks, pkg, refusal: { key: "refuseKey", value: "0x" + chipKey.toString(16).toUpperCase() } };
  if (bad.length)
    return { ok: false, checks, pkg, refusal: { key: "refuseKey", value: "0x" + chipKey.toString(16).toUpperCase() } };
  checks.push({ key: "accKey", value: "0x" + chipKey.toString(16).toUpperCase(), ok: true });

  const end = image;
  checks.push({ key: "accRange", value: `0x${ACCEPT_BOOT_AREA.toString(16).toUpperCase().padStart(5, "0")}-0x${(end - 1).toString(16).toUpperCase().padStart(5, "0")}`, ok: true });
  checks.push({ key: "accSectors", value: String((end - ACCEPT_BOOT_AREA) / ACCEPT_SECTOR), ok: true });
  checks.push({ key: "accBoot", value: "0x00000-0x03FFF", ok: true });
  checks.push({ key: "accFactory", value: `0x${ACCEPT_FACTORY.toString(16).toUpperCase()}`, ok: end <= ACCEPT_FACTORY });
  if (end > ACCEPT_FACTORY)
    return { ok: false, checks, pkg, refusal: { key: "refuseFactory", value: `0x${(end - 1).toString(16).toUpperCase()}` } };
  return { ok: true, checks, pkg, refusal: null, product, model, image };
}

const runsOf = (sectors) => {
  const out = [];
  for (const a of sectors) {
    const last = out[out.length - 1];
    if (last && last[1] === a) last[1] = a + ACCEPT_SECTOR;
    else out.push([a, a + ACCEPT_SECTOR]);
  }
  return out;
};

/* The plan M-Flasher builds: target = the unit's image with [0x4000, len) taken from the package.
 * Without a dump only the bound is known (every sector of the range may differ); with one, the exact
 * sectors it will erase and write -- and nothing outside that range can change, by construction. */
function sectorPlan(pkg, dump) {
  const len = pkg.flashSize;
  const range = [ACCEPT_BOOT_AREA, len];
  const bound = (len - ACCEPT_BOOT_AREA) / ACCEPT_SECTOR;
  if (!dump) return { range, bound, exact: false, sectors: [], runs: [], unchanged: null };
  if (dump.length !== ACCEPT_FLASH_MAX) return { range, bound, exact: false, sectors: [], runs: [], unchanged: null, badDump: dump.length };
  const sectors = [];
  let unchanged = 0;
  for (let a = ACCEPT_BOOT_AREA; a < len; a += ACCEPT_SECTOR) {
    const d = dump.subarray(a, a + ACCEPT_SECTOR), p = pkg.flash.subarray(a, a + ACCEPT_SECTOR);
    let diff = false;
    for (let i = 0; i < ACCEPT_SECTOR; i++) if (d[i] !== p[i]) { diff = true; break; }
    if (diff) sectors.push(a); else unchanged++;
  }
  return { range, bound, exact: true, sectors, runs: runsOf(sectors), unchanged };
}

const hexRange = (r) =>
  `0x${r[0].toString(16).toUpperCase().padStart(5, "0")}-0x${(r[1] - 1).toString(16).toUpperCase().padStart(5, "0")}`;

const $ = (id) => document.getElementById(id);
const PT = {
  en: {

    checks: "The installer's checks on this package",
    pkgline: "package",

    accContainer: "package (identity)", accImage: "flash image", accHeaderCrc: "header CRC16",

  },
  es: {
    title: "El plan antes de escribir",
    lead: "Tu dump y el paquete que sirve este sitio, y los sectores que va a borrar el instalador. Esta página corre sobre el paquete las mismas comprobaciones que hace el instalador y planifica la escritura con tus bytes; no se envía nada a la unidad y desde acá no se escribe nada.",
    dump: "Tu dump (.bin, 1 MiB):",
    checks: "Las comprobaciones del instalador sobre este paquete",

    accListCrc: "ficheros en la lista", accFlashCrc: "CRC16 de flash.bin", accModel: "modelo",
    accSize: "entra en la parte de 1 MiB", accAppFile: "fichero de la app, descifrado, CRC16", accKey: "chip key",

    refuseFactory: "El instalador rechaza este paquete — llega a los datos de fábrica:",
    bound: "Como máximo %n sectores: toda el área de aplicación. Cargá tu dump para el plan exacto.",
    exact: "Escribe %n sectores (%k KiB): %r",
    unchanged: "Los otros %n sectores ya coinciden y no se tocan.",
    badDump: "Ese archivo tiene %n B: el dump de esta unidad es de 1048576 B. No se usó.",
    badPkg: "No se pudo cargar el paquete del release, o no coincide con su SHA-256 publicado.",
    note: "Lo que esto no puede decir: qué va a contestar tu unidad cuando la abra el instalador — vuelve a identificar el modelo y la chip key antes de escribir.",

let lang = (() => { try { return localStorage.getItem("qg-plan-lang") === "es" ? "es" : "en"; } catch (_) { return "en"; } })();
const t = (k) => (PT[lang] && PT[lang][k]) || PT.en[k] || k;
const fill = (s, m) => Object.keys(m).reduce((a, k) => a.split("%" + k).join(m[k]), s);
let pkg = null, pkgBytes = null;

function paint() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach((e) => { e.textContent = t(e.dataset.t); });
  $("lang").textContent = lang === "en" ? "ES" : "EN";
  $("next").textContent = t("next");
  if (pkgBytes) $("pkgline").textContent = `${t("pkgline")}: ${acceptance(pkgBytes).product} · ${pkgBytes.length} B · sha256 ${pkgHash.slice(0, 16)}…`;
  render();
}

let pkgHash = "", dump = null;
function render() {
  const rows = $("rows"), verdict = $("verdict"), note = $("note");
  rows.textContent = "";
  if (!pkgBytes) { verdict.textContent = t("badPkg"); note.textContent = ""; return; }
  const acc = acceptance(pkgBytes);
  const add = (label, value) => {
    const dt = document.createElement("dt"); dt.textContent = label;
    const dd = document.createElement("dd"); dd.textContent = value;
    rows.append(dt, dd);
  };
  for (const c of acc.checks) add(t(c.key), c.value);
  if (!acc.ok) {
    verdict.textContent = "\u2717 " + t(acc.refusal.key) + " " + acc.refusal.value;
    verdict.style.color = "var(--gold)"; note.textContent = "";
    return;
  }
  verdict.style.color = "";
  const plan = sectorPlan(acc.pkg, dump);
  if (plan.badDump) {
    verdict.textContent = "\u2717 " + fill(t("badDump"), { n: plan.badDump });
    verdict.style.color = "var(--gold)"; note.textContent = "";
    return;
  }
  if (!plan.exact) {
    verdict.textContent = "\u25CB " + fill(t("bound"), { n: plan.bound });
    note.textContent = t("note");
    return;
  }
  verdict.style.color = "var(--accent)";
  const runs = plan.runs.length ? plan.runs.map(hexRange).join(", ") : "\u2014";
  verdict.textContent = "\u2713 " + fill(t("exact"), { n: plan.sectors.length,
    k: (plan.sectors.length * ACCEPT_SECTOR / 1024).toFixed(0), r: runs });
  note.textContent = (plan.unchanged ? fill(t("unchanged"), { n: plan.unchanged }) + " " : "") + t("note");
}

$("dump").addEventListener("change", async (ev) => {
  const f = ev.target.files && ev.target.files[0];
  dump = f ? new Uint8Array(await f.arrayBuffer()) : null;
  render();
});
$("lang").addEventListener("click", () => {
  lang = lang === "en" ? "es" : "en";
  try { localStorage.setItem("qg-plan-lang", lang); } catch (_) {}
  paint();
});

/* the package this site serves: its own versions.json names the file and the SHA-256 published with it,
   and the bytes are hashed here before any check runs on them */
(async () => {
  try {
    /* versions.json names the file beside it and its SHA-256; the path is built from the same base (the
       `pkg` field in there is relative to the installer page, which is not where this page lives) */
    let done = false;
    for (const base of ["../firmware/"]) {
      const vres = await fetch(base + "versions.json");
      if (!vres.ok) continue;
      const versions = await vres.json();
      const v = versions[0];
      if (!v || !v.file) continue;
      const r = await fetch(base + v.file);
      if (!r.ok) throw new Error(`${base}${v.file}: HTTP ${r.status}`);
      const bytes = new Uint8Array(await r.arrayBuffer());
      const hash = await sha256hex(bytes);
      if (v.sha256 && hash !== v.sha256) throw new Error("sha256 mismatch");
      pkgHash = hash; pkgBytes = bytes;
      paint();
      done = true;
      break;
    }
    if (!done) throw new Error("no release channel");
  } catch (e) {
    pkgBytes = null; paint();
    $("verdict").textContent = "\u2717 " + t("badPkg") + " (" + (e && e.message) + ")";
    $("verdict").style.color = "var(--gold)";
  }
})();
</script>
