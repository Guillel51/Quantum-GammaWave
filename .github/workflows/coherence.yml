# SPDX-License-Identifier: GPL-3.0-only
# Quantum GammaWave — the tree may not contradict itself.
#
# Every failure this catches has already happened here at least once, and each one reached `main` without
# anything going red: merge markers committed inside `firmware/src/felucca.c` (the firmware did not compile),
# a `FELUCCA_VERSION` with no package in `release/`, a manifest whose hash disagreed with its bytes, a
# `site/firmware/versions.json` naming a hash the package does not have, and an emulator record from a
# different build than the firmware beside it.
#
# It runs on every push and pull request, needs no secret, reads only tracked files and takes seconds, so a
# contradiction is reported before anything is published from it.
name: coherence

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coherence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: the tree agrees with itself
        run: python3 tools/coherence_check.py
      # These two lived in `pages.yml`, which also deployed the committed `site/` -- the second publisher of
      # Pages, racing `emulator.yml` in its own concurrency group. The deployment is gone (one publisher: the
      # workflow that builds the site); the checks stay, here, in the job that already pins Python and checks
      # out the full history. `make_release --check` is the same release-set agreement the pre-flight runs
      # before a tag exists.
      - name: the committed site is the release set's
        run: python3 tools/make_release.py --check
      - name: the portal, its links and its images
        run: |
          test -s site/index.html || { echo "::error::site/index.html is empty: Pages would serve a blank page"; exit 1; }
          python3 web/test_site.py site
