# SPDX-License-Identifier: GPL-3.0-only
# The browser emulator (web/emu) on GitHub Pages: the firmware's sources compiled to WebAssembly, on every push to
# main. Needs Settings > Pages > Source: "GitHub Actions" once. The emulator needs only the generated headers; the
# installer (webapp/installer) and the editor (webapp/editor) need the package, built with JieLi's toolchain (downloaded).
# (JIANT 0.6.61) Two channels: the emulator and preview/webapp/installer are main as it is now (to check before anyone
# installs it); webapp/installer, the one people use, is the version approved in web/STABLE (a commit of main, set by
# a PR once the preview was checked in the emulator). No web/STABLE yet: main, as before.
name: emulator
# (QG-1) Also on every other push and pull request that touches the firmware, the page or the tools: the emulator
# built and smoke-tested (web/emu/emu_test.mjs) and kept as an artifact (emulator-<sha>) to download and open; only
# main goes up to Pages.
on:
  push:
    paths: ["firmware/**", "web/**", "tools/**", "tests/target_budget.txt", "tests/target_budget.py", "build.sh",
            ".github/workflows/emulator.yml"]
  pull_request:
    paths: ["firmware/**", "web/**", "tools/**", "tests/target_budget.txt", "tests/target_budget.py", "build.sh",
            ".github/workflows/emulator.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                 # (web/STABLE's commit: built for the public installer)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install Pillow numpy fonttools cryptography
      - name: generated headers (fonts, icons, palettes, shapes, tables, samples)
        run: python3 -c "import sys; sys.path.insert(0, 'tools'); import build; build.generate()"
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.11                # (the version the emulator is tested with)
      - name: the emulator
        env:
          EMU_PREVIEW: "0"
        run: sh web/emu/build.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: the emulator boots, plays, saves (smoke test; the cost check relaxed for shared runners)
        run: BENCH_MAX=1.5 node web/emu/emu_test.mjs build/emu/felucca.wasm
      - name: the emulator as an artifact (every branch, every PR)
        uses: actions/upload-artifact@v4
        with:
          name: emulator-${{ github.sha }}
          path: build/emu
          retention-days: 14
      # (JIANT) the installer and the web editor next to the emulator: the package needs JieLi's toolchain (downloaded)
      # and three files of their AC79 SDK (a partial clone: only those blobs). If any of it fails the emulator still
      # goes up. (QG-1 stage 3) On every pull request too: the DSP budget and the .fwsc reader need the target
      # compiler, and a PR is exactly where a render loop or the package reader can regress.
      - name: JieLi toolchain and SDK files (cached)
        uses: actions/cache@v4
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK/cpu/wl82/tools
          key: jieli-ac79-v1
      - name: JieLi toolchain and SDK files
        id: tc
        continue-on-error: true
        env:
          # (QG-1 stage 3) the reviewed SHA-256 of the toolchain archive (Settings > Variables). Empty: the
          # download still runs and prints the hash it got, so the value can be reviewed and set
          JIELI_TOOLCHAIN_SHA256: ${{ vars.JIELI_TOOLCHAIN_SHA256 }}
        run: |
          # gitee resets connections from the runners now and then: retries with backoff; the cache above keeps them
          retry() { for d in 0 5 15 30 60; do sleep $d; "$@" && return 0; done; return 1; }
          T=$HOME/fw-AC79_AIoT_SDK/cpu/wl82/tools
          [ -e "$HOME/.jieli/toolchain" ] || retry sh tools/get_toolchain.sh "$HOME/.jieli"
          if [ ! -s "$T/uboot.boot" ] || [ ! -s "$T/cfg_tool.bin" ] || [ ! -s "$T/cfg/eq_cfg_hw.bin" ]; then
            rm -rf "$HOME/fw-AC79_AIoT_SDK"
            retry git clone --filter=blob:none --no-checkout --depth 1 https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK"
            cd "$HOME/fw-AC79_AIoT_SDK" && git sparse-checkout set --no-cone /cpu/wl82/tools/uboot.boot /cpu/wl82/tools/cfg_tool.bin \
              /cpu/wl82/tools/cfg/eq_cfg_hw.bin && retry git checkout
          fi
          test -s "$T/uboot.boot" && test -s "$T/cfg_tool.bin" && test -s "$T/cfg/eq_cfg_hw.bin"
      - name: the package, the installer and the editor
        if: steps.tc.outcome == 'success'
        continue-on-error: true
        env:
          AC79_SDK: /home/runner/fw-AC79_AIoT_SDK
          JIELI_TOOLCHAIN: /home/runner/.jieli/toolchain
        run: |
          ver() { sed -n 's/^#define FELUCCA_VERSION "\([^"]*\)".*/\1/p' "$1/firmware/src/felucca.c" | head -1; }
          # the preview: main as it is now, next to the emulator that runs it (preview/webapp/installer)
          python3 tools/build.py
          V=$(ver .)
          python3 web/make_site.py build/felucca.fwsc "${V:-dev}-${GITHUB_SHA::7}-preview" build/site_preview
          mkdir -p build/site_preview/emulator
          cp -r build/emu/. build/site_preview/emulator/
          mkdir -p build/emu/preview
          cp -r build/site_preview/index.html build/site_preview/assets build/site_preview/webapp build/site_preview/firmware build/site_preview/emulator build/emu/preview/
          # the public installer: the approved commit (web/STABLE), built from its own sources
          S=$(tr -d ' \n' < web/STABLE 2>/dev/null || true)
          PKG=build/felucca.fwsc; SV=${V:-dev}; SH=${GITHUB_SHA::7}
          if [ -n "$S" ] && git cat-file -e "$S^{commit}" 2>/dev/null; then
            git worktree add -f /tmp/stable "$S"
            (cd /tmp/stable && python3 tools/build.py)
            PKG=/tmp/stable/build/felucca.fwsc; SV=$(ver /tmp/stable); SH=${S::7}
          fi
          # (0.6.46) the versions the site offers now stay installable (the last few, web/fetch_prev.py)
          python3 web/fetch_prev.py "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}" build/prev || true
          python3 web/make_site.py "$PKG" "${SV:-dev}-$SH" build/site build/prev
          # the portal is / and the emulator keeps a stable /emulator/ path; installer and editor keep /webapp/
          mkdir -p build/site/emulator
          cp -r build/emu/. build/site/emulator/
          rm -rf build/site/emulator/preview
          # the artifact and preview copy stay emulator-shaped, with the preview portal at /preview/
          mkdir -p build/emu/preview
          cp -r build/site/index.html build/site/assets build/site/webapp build/site/firmware build/emu/preview/
      # (QG-1 stage 2/3) the two checks that need the target compiler, on main and on every PR. On main the step
      # above has just built the package; on a PR (no site, no deploy) this is the only build. Not
      # continue-on-error: a regression here is the point of running them.
      - name: target compiler checks (DSP budget of the render loops, the .fwsc reader on the package)
        if: steps.tc.outcome == 'success'
        env:
          AC79_SDK: /home/runner/fw-AC79_AIoT_SDK
          JIELI_TOOLCHAIN: /home/runner/.jieli/toolchain
        run: |
          if [ ! -s build/felucca.dis ] || [ ! -s build/felucca.fwsc ]; then python3 tools/build.py; fi
          python3 tests/target_budget.py build/felucca.dis tests/target_budget.txt
          node web/test_pkg_bounds.mjs build/felucca.fwsc
      # (QG-1 phase 2) The install gate is not a suggestion: both routes must refuse to start an update
      # without the physical NOR id. test_web.mjs counts the frames the simulated FM-1 receives, and
      # preflight_test.py does the same for the CLI (including a direct Updater.write()).
      - name: the install gate cannot be bypassed (CLI and web)
        if: steps.tc.outcome == 'success'
        run: |
          node web/test_web.mjs
          python3 tests/preflight_test.py build/felucca.fwsc
          python3 tests/chip_test.py
          python3 tests/sign_test.py
      # (QG-1) The portal and the emulator go up even when JieLi's toolchain is missing: the site then offers the
      # package already built for the target (firmware/packages, the published one), never a rebuild it did not do.
      - name: the site, with the published package when the target build produced none
        if: ${{ hashFiles('build/site/index.html') == '' }}
        run: |
          PKG=$(ls firmware/packages/*.fwsc 2>/dev/null | head -1)
          test -s "$PKG" || { echo "::error::no package in firmware/packages and no target build"; exit 1; }
          SV=$(basename "$PKG" .fwsc); SV=${SV#felucca-}
          echo "the target toolchain did not run: the site offers $SV, compiled earlier for the FM-1"
          python3 web/fetch_prev.py "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}" build/prev || true
          python3 web/make_site.py "$PKG" "$SV" build/site build/prev
          mkdir -p build/site/emulator
          cp -r build/emu/. build/site/emulator/
          rm -rf build/site/emulator/preview
      # Fail closed: the fallback site above must never turn a missing target build into a green
      # release. The emulator-only preview may still be uploaded, but publishing is blocked.
      - name: require the target package and target checks (fail closed)
        if: always()
        run: |
          test -s build/felucca.fwsc || { echo "::error::no target package was built"; exit 1; }
          test -s build/felucca.dis || { echo "::error::no target disassembly was produced"; exit 1; }
      - name: the site exists (the deploy would otherwise upload nothing)
        run: |
          ls -la build | head -20
          test -s build/site/index.html || { echo "::error::build/site/index.html is missing, nothing to publish"; exit 1; }
      - uses: actions/upload-pages-artifact@v3
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/perf/security-hardening' || github.ref == 'refs/heads/work/v18-integration') && github.event_name != 'pull_request'
        with:
          path: build/site
  deploy:
    needs: build
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/perf/security-hardening' || github.ref == 'refs/heads/work/v18-integration') && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      # (QG-1 stage 2) deploy-pages fails with "Get Pages site failed (404)" when Pages has never been
      # enabled, and GitHub does not let the job's own token create the site: say what to do instead
      - name: "Pages is enabled (Settings > Pages > Build and deployment > Source: GitHub Actions)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh api "repos/${{ github.repository }}/pages" > /tmp/pages.json 2>/dev/null; then
            echo "::error::GitHub Pages is not enabled for ${{ github.repository }}: deploy-pages would fail with HTTP 404. Enable it once, Settings > Pages > Build and deployment > Source: GitHub Actions (no workflow change is needed)."
            exit 1
          fi
          echo "Pages: $(tr -d '\n' < /tmp/pages.json)"
      - id: deployment
        uses: actions/deploy-pages@v4
