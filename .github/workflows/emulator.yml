# SPDX-License-Identifier: GPL-3.0-only
# The browser emulator (web/emu) on GitHub Pages: the firmware's sources compiled to WebAssembly, on every push to
# main. Needs Settings > Pages > Source: "GitHub Actions" once. The emulator needs only the generated headers; the
# installer (webapp/installer) and the editor (webapp/editor) need the package, built with JieLi's toolchain (downloaded).
# (JIANT 0.6.61) Two channels: the emulator and preview/webapp/installer are main as it is now (to check before anyone
# installs it); webapp/installer, the one people use, is the version approved in web/STABLE (a commit of main, set by
# a PR once the preview was checked in the emulator). No web/STABLE yet: main, as before.
name: emulator
# (QG-1) Also on every other push and pull request that touches the firmware, the page or the tools: the emulator
# built and smoke-tested (web/emu/emu_test.mjs) and kept as an artifact (emulator-<sha>) to download and open; only
# main goes up to Pages.
on:
  push:
    paths: ["firmware/**", "web/**", "tools/**", "tests/target_budget.txt", "tests/target_budget.py", "build.sh",
            "release/**", "docs/RELEASE_NOTES_v1.9.0.md", ".github/workflows/emulator.yml"]
  pull_request:
    paths: ["firmware/**", "web/**", "tools/**", "tests/target_budget.txt", "tests/target_budget.py", "build.sh",
            ".github/workflows/emulator.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                 # (web/STABLE's commit: built for the public installer)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install Pillow numpy fonttools cryptography
      - name: generated headers (fonts, icons, palettes, shapes, tables, samples)
        run: python3 -c "import sys; sys.path.insert(0, 'tools'); import build; build.generate()"
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.11                # (the version the emulator is tested with)
      - name: the emulator
        env:
          EMU_PREVIEW: "0"
        run: sh web/emu/build.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: the emulator boots, plays, saves (smoke test; the cost check relaxed for shared runners)
        run: BENCH_MAX=1.5 node web/emu/emu_test.mjs build/emu/felucca.wasm
      - name: the emulator as an artifact (every branch, every PR)
        uses: actions/upload-artifact@v4
        with:
          name: emulator-${{ github.sha }}
          path: build/emu
          retention-days: 14
      # (JIANT) the installer and the web editor next to the emulator: the package needs JieLi's toolchain (downloaded)
      # and three files of their AC79 SDK (a partial clone: only those blobs). If any of it fails the emulator still
      # goes up. (QG-1 stage 3) On every pull request too: the DSP budget and the .fwsc reader need the target
      # compiler, and a PR is exactly where a render loop or the package reader can regress.
      - name: JieLi toolchain and SDK files (cached)
        uses: actions/cache@v4
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK/cpu/wl82/tools
          key: jieli-ac79-v1
      - name: JieLi toolchain and SDK files
        id: tc
        continue-on-error: true
        env:
          # (QG-1 stage 3) the reviewed SHA-256 of the toolchain archive (Settings > Variables). Empty: the
          # download still runs and prints the hash it got, so the value can be reviewed and set
          JIELI_TOOLCHAIN_SHA256: ${{ vars.JIELI_TOOLCHAIN_SHA256 }}
        run: |
          # gitee resets connections from the runners now and then: retries with backoff; the cache above keeps them
          retry() { for d in 0 5 15 30 60; do sleep $d; "$@" && return 0; done; return 1; }
          T=$HOME/fw-AC79_AIoT_SDK/cpu/wl82/tools
          [ -e "$HOME/.jieli/toolchain" ] || retry sh tools/get_toolchain.sh "$HOME/.jieli"
          if [ ! -s "$T/uboot.boot" ] || [ ! -s "$T/cfg_tool.bin" ] || [ ! -s "$T/cfg/eq_cfg_hw.bin" ]; then
            rm -rf "$HOME/fw-AC79_AIoT_SDK"
            retry git clone --filter=blob:none --no-checkout --depth 1 https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK"
            cd "$HOME/fw-AC79_AIoT_SDK" && git sparse-checkout set --no-cone /cpu/wl82/tools/uboot.boot /cpu/wl82/tools/cfg_tool.bin \
              /cpu/wl82/tools/cfg/eq_cfg_hw.bin && retry git checkout
          fi
          test -s "$T/uboot.boot" && test -s "$T/cfg_tool.bin" && test -s "$T/cfg/eq_cfg_hw.bin"
      - name: the package, the installer and the editor
        if: steps.tc.outcome == 'success'
        continue-on-error: true
        env:
          AC79_SDK: /home/runner/fw-AC79_AIoT_SDK
          JIELI_TOOLCHAIN: /home/runner/.jieli/toolchain
        run: |
          # the label the site shows must be the build record's version plus the commit it was built
          # from, and nothing else: make_site.py refuses anything but "v1.9.0-8549ed4". FELUCCA_VERSION
          # already carries the leading v, so ver() returns it as written; the old label appended
          # "-preview" and every site build was refused.
          ver() { sed -n 's/^#define FELUCCA_VERSION "\([^"]*\)".*/\1/p' "$1/firmware/src/felucca.c" | head -1; }
          # the preview: main as it is now, next to the emulator that runs it (preview/webapp/installer)
          python3 tools/build.py
          V=$(ver .)
          python3 web/make_site.py build/felucca.fwsc "${V:-dev}-${GITHUB_SHA::7}" build/site_preview \
            --emu build/emu/manifest.json
          mkdir -p build/site_preview/emulator
          cp -r build/emu/. build/site_preview/emulator/
          mkdir -p build/emu/preview
          cp -r build/site_preview/index.html build/site_preview/assets build/site_preview/webapp build/site_preview/firmware build/site_preview/emulator build/emu/preview/
          # the public installer: the approved commit (web/STABLE), built from its own sources
          S=$(tr -d ' \n' < web/STABLE 2>/dev/null || true)
          PKG=build/felucca.fwsc; SV=${V:-dev}; SH=${GITHUB_SHA::7}
          if [ -n "$S" ] && git cat-file -e "$S^{commit}" 2>/dev/null; then
            git worktree add -f /tmp/stable "$S"
            (cd /tmp/stable && python3 tools/build.py)
            PKG=/tmp/stable/build/felucca.fwsc; SV=$(ver /tmp/stable); SH=${S::7}
          fi
          # The signed release wins over every package built here: the private key is not in CI, so a
          # package built in this run has no signature and the installer refuses it. release/ carries
          # the bytes a person signed, with their manifest and the record that binds them.
          RELMAN=""
          RELPKG=$(ls release/*.fwsc 2>/dev/null | head -1 || true)
          if [ -n "$RELPKG" ]; then
            PKG=$RELPKG; REC=release/build-manifest.json; RELMAN=$REC
            SV=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["version"].lstrip("v"))' "$REC")
            SH=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["commit"][:7])' "$REC")
            echo "the public site offers the signed release: $PKG ($SV-$SH)"
          fi
          # The public site is ONE release: its package AND its emulator. When it serves the signed
          # release, the emulator must be the one built beside that package, not the one this run built
          # from main -- the installer holds the package to the emulator its own record names
          # (fm1provenance.js), so a main ahead of the release would otherwise serve an emulator from
          # another tree and be refused by its own page. The release emulator is reproducible from the
          # release commit with this toolchain (3d039f75bbc8 for 7eb9636), so it is built here.
          EMU_SRC=build/emu
          if [ -n "$RELMAN" ]; then
            R=$(python3 -c 'import json;print(json.load(open("release/build-manifest.json"))["commit"])')
            rm -rf /tmp/reltree build/emu_release
            git worktree prune
            git worktree add -f -q --detach /tmp/reltree "$R"      # -f: another step may have registered this path
            # GITHUB_SHA/GIT_COMMIT are unset on purpose: tools/package_emu.py prefers them over
            # `git rev-parse HEAD`, so with them in the environment this emulator would carry the run's
            # commit while holding the release's bytes -- a manifest that names a build it is not.
            ( cd /tmp/reltree &&
              env -u GITHUB_SHA -u GIT_COMMIT python3 -c "import sys; sys.path.insert(0, 'tools'); import build; build.generate()" >/dev/null &&
              env -u GITHUB_SHA -u GIT_COMMIT sh web/emu/build.sh >/dev/null )
            cp -r /tmp/reltree/build/emu build/emu_release
            EMU_SRC=build/emu_release
            echo "the public site serves the release's emulator: $(python3 -c 'import json;print(json.load(open("build/emu_release/manifest.json"))["wasm_sha256"][:16])')"
          fi
          # (0.6.46) the versions the site offers now stay installable (the last few, web/fetch_prev.py)
          python3 web/fetch_prev.py "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}" build/prev || true
          if [ -n "$RELMAN" ]; then
            python3 web/make_site.py "$PKG" "v${SV}-${SH}" build/site build/prev --manifest "$RELMAN" --emu "$EMU_SRC/manifest.json"
          else
            python3 web/make_site.py "$PKG" "${SV:-dev}-$SH" build/site build/prev --emu "$EMU_SRC/manifest.json"
          fi
          # the portal is / and the emulator keeps a stable /emulator/ path; installer and editor keep /webapp/
          mkdir -p build/site/emulator
          cp -r "$EMU_SRC/." build/site/emulator/
          rm -rf build/site/emulator/preview
          # the artifact and preview copy stay emulator-shaped, with the preview portal at /preview/
          mkdir -p build/emu/preview
          cp -r build/site/index.html build/site/assets build/site/webapp build/site/firmware build/emu/preview/
      # (QG-1 stage 2/3) the two checks that need the target compiler, on main and on every PR. On main the step
      # above has just built the package; on a PR (no site, no deploy) this is the only build. Not
      # continue-on-error: a regression here is the point of running them.
      - name: target compiler checks (DSP budget of the render loops, the .fwsc reader on the package)
        if: steps.tc.outcome == 'success'
        env:
          AC79_SDK: /home/runner/fw-AC79_AIoT_SDK
          JIELI_TOOLCHAIN: /home/runner/.jieli/toolchain
        run: |
          if [ ! -s build/felucca.dis ] || [ ! -s build/felucca.fwsc ]; then python3 tools/build.py; fi
          python3 tests/target_budget.py build/felucca.dis tests/target_budget.txt
          node web/test_pkg_bounds.mjs build/felucca.fwsc
      # (QG-1 phase 2) The install gate is not a suggestion: both routes must refuse to start an update
      # without the physical NOR id. test_web.mjs counts the frames the simulated FM-1 receives, and
      # preflight_test.py does the same for the CLI (including a direct Updater.write()).
      - name: the install gate cannot be bypassed (CLI and web)
        if: steps.tc.outcome == 'success'
        run: |
          node web/test_web.mjs
          node web/test_verify_only.mjs
          node web/test_provenance.mjs
          python3 tests/preflight_test.py build/felucca.fwsc
          python3 tests/chip_test.py
          python3 tests/flash_evidence_test.py
          python3 tests/flash_read_test.py
          python3 tests/mflasher_test.py
      # (QG-1) The portal and the emulator go up whether or not JieLi's toolchain could be downloaded in this
      # run. The package is the one built here when the target build ran, and the one committed in
      # firmware/packages otherwise -- never a guess, and never a rebuild that did not happen. Both carry their
      # own build record, and make_site.py refuses to publish a package that contradicts it (hash, size,
      # identity, the commit it names, the emulator that record names), so the gate is provenance, not luck.
      # It used to be "a target package must exist in THIS run": with gitee unreachable the job failed closed
      # and Pages never deployed, which is how twenty-two commits went unpublished.
      - name: the site (this run's package, or the committed one with its record checked)
        run: |
          ver() { sed -n 's/^#define FELUCCA_VERSION "\([^"]*\)".*/\1/p' "$1/firmware/src/felucca.c" | head -1; }
          MAN=""; REC=""
          if ls release/*.fwsc >/dev/null 2>&1; then
            # The signed release is what people should install: a package built in this run carries no
            # signature (the private key is not in CI) and the installer refuses unsigned bytes. So when
            # release/ holds one, the site serves that package, its signature and its build record.
            PKG=$(ls release/*.fwsc | head -1)
            REC=release/build-manifest.json
            MAN="${PKG%.fwsc}.manifest.json"; test -s "$MAN" || MAN=""
            SV=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["version"].lstrip("v"))' "$REC")
            SH=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["commit"][:7])' "$REC")
            echo "the site offers the signed release: $PKG ($SV-$SH)"
          elif [ -s build/site/index.html ] && [ -s build/felucca.fwsc ]; then
            echo "the site was built from this run's package above"; exit 0
          elif [ -s build/felucca.fwsc ]; then
            PKG=build/felucca.fwsc; SV=$(ver .); SH=${GITHUB_SHA::7}
            echo "the site offers this run's target build: $SV-$SH"
          else
            PKG=$(ls firmware/packages/*.fwsc 2>/dev/null | head -1)
            test -s "$PKG" || { echo "::error::no target package in this run and none committed in firmware/packages"; exit 1; }
            SV=$(basename "$PKG" .fwsc); SV=${SV#felucca-}
            SH=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['commit'][:7])" "$PKG.build.json")
            echo "no target build in this run: the site offers $SV-$SH, committed with its build record"
          fi
          # The public site is ONE release: its package AND its emulator. When it serves the committed
          # release, the emulator has to be the one built beside that package, not the one this run built
          # from main -- the installer holds the package to the emulator its own record names
          # (fm1provenance.js), so a main that advanced past the release would otherwise serve an
          # emulator from another tree and be refused by its own page. The release emulator is
          # reproducible from the release commit with this same toolchain, so it is built here.
          EMU_SRC=build/emu
          if [ -s build/emu_release/manifest.json ]; then
            EMU_SRC=build/emu_release            # the step above already built the release's emulator
            echo "reusing the release emulator built above"
          elif [ -s release/build-manifest.json ] && ls release/*.fwsc >/dev/null 2>&1; then
            R=$(python3 -c 'import json;print(json.load(open("release/build-manifest.json"))["commit"])')
            rm -rf /tmp/reltree build/emu_release
            git worktree prune
            git worktree add -f -q --detach /tmp/reltree "$R"      # -f: another step may have registered this path
            # GITHUB_SHA/GIT_COMMIT are unset on purpose: tools/package_emu.py prefers them over
            # `git rev-parse HEAD`, so with them in the environment this emulator would carry the run's
            # commit while holding the release's bytes -- a manifest that names a build it is not.
            ( cd /tmp/reltree &&
              env -u GITHUB_SHA -u GIT_COMMIT python3 -c "import sys; sys.path.insert(0, 'tools'); import build; build.generate()" >/dev/null &&
              env -u GITHUB_SHA -u GIT_COMMIT sh web/emu/build.sh >/dev/null )
            cp -r /tmp/reltree/build/emu build/emu_release
            EMU_SRC=build/emu_release
            echo "the site serves the release's emulator: $(python3 -c 'import json;print(json.load(open("build/emu_release/manifest.json"))["wasm_sha256"][:16])')"
          fi
          python3 web/fetch_prev.py "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}" build/prev || true
          if [ -n "$MAN" ]; then
            python3 web/make_site.py "$PKG" "v${SV}-${SH}" build/site build/prev --manifest "$REC" \
              --emu "$EMU_SRC/manifest.json"
          else
            python3 web/make_site.py "$PKG" "${SV}-${SH}" build/site build/prev --emu "$EMU_SRC/manifest.json"
          fi
          mkdir -p build/site/emulator
          cp -r "$EMU_SRC/." build/site/emulator/
          rm -rf build/site/emulator/preview
          # (M3.4) the preview channel goes up too, at /preview/: main's sources with the emulator that runs
          # them. The root keeps the signed release beside the emulator built with it (what a person
          # installs is what they can try); main's work — LATCH, punch-in, the splash, HOME, the planets,
          # RESO, CLOUD, delay, the FX screens — stops being invisible until the next release. The channel
          # was built above and never published, which is how "the emulator is old" was both true and only
          # half the story.
          if [ -s build/site_preview/index.html ] && [ -s build/site_preview/emulator/manifest.json ]; then
            rm -rf build/site/preview
            cp -r build/site_preview build/site/preview
            echo "preview: main's site at /preview/, emulator $(python3 -c 'import json;print(json.load(open("build/site_preview/emulator/manifest.json"))["commit"])')"
          else
            echo "::warning::no preview site in this run: /preview/ will not be published"
          fi
      # Fail closed on what actually matters: a package was chosen and a site was written. Its provenance was
      # checked by make_site.py, which refuses a package that contradicts its own build record.
      - name: a package and a site exist (fail closed)
        if: always()
        run: |
          test -s build/felucca.fwsc || ls -l firmware/packages/*.fwsc || { echo "::error::no package anywhere"; exit 1; }
          test -s build/site/index.html || { echo "::error::the site was not built"; exit 1; }

      - name: the site exists (the deploy would otherwise upload nothing)
        run: |
          ls -la build | head -20
          test -s build/site/index.html || { echo "::error::build/site/index.html is missing, nothing to publish"; exit 1; }
      # (M3.4) main only. The public site is one artefact and Pages keeps the last one published, so a
      # side branch that deployed could (and did) put an older tree back over main's: the site went from
      # the new build back to v1.9.0-7eb9636 with no push to main in between. A branch that wants to be
      # seen publishes an artifact, not the site.
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: build/site
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      # (QG-1 stage 2) deploy-pages fails with "Get Pages site failed (404)" when Pages has never been
      # enabled, and GitHub does not let the job's own token create the site: say what to do instead
      - name: "Pages is enabled (Settings > Pages > Build and deployment > Source: GitHub Actions)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh api "repos/${{ github.repository }}/pages" > /tmp/pages.json 2>/dev/null; then
            echo "::error::GitHub Pages is not enabled for ${{ github.repository }}: deploy-pages would fail with HTTP 404. Enable it once, Settings > Pages > Build and deployment > Source: GitHub Actions (no workflow change is needed)."
            exit 1
          fi
          echo "Pages: $(tr -d '\n' < /tmp/pages.json)"
      - id: deployment
        uses: actions/deploy-pages@v4
      # Pages answers "Deployment failed, try again later." from deployment_failed, a terminal status the
      # action stops polling on: the artifact is fine and the build job is green (runs 42261322522 and
      # 42267114599 both died here, after the site had been built and uploaded). A second attempt is what
      # GitHub's own issue tracker recommends for this status, and it is the only retry this workflow makes.
      - name: Deploy to GitHub Pages (one retry, Pages' deployment_failed is transient)
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
      # A deploy that reported success is not a site that serves this commit: Pages can take a moment to
      # switch over, and the previous artifact stays up until it does. This reads the published origin
      # and holds versions.json, the package, the emulator manifest, the wasm, the portal and the
      # installer to this run's commit, retrying while the switch happens rather than sampling once.
      # (the deploy job never checked the repository out: without this the check could not even run,
      # and run 42276334594 failed on a script that was not there while the site was serving the commit)
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/site_check.py
            release/
          sparse-checkout-cone-mode: false
      - name: the published site is the release it offers (versions.json, package, wasm, portal, installer)
        run: |
          # Two artefacts, two commits, and neither of them is HEAD by design. The package is a signed
          # release committed under release/, built at the commit its record names; the emulator is this
          # run's build. This used to demand ${GITHUB_SHA} of both, which no release commit can satisfy:
          # the package is built before the commit that adds it. So: hold the package to the signed bytes
          # and the record's commit, and the emulator to the commit that built it.
          if ls release/*.fwsc >/dev/null 2>&1; then
            R=$(python3 -c 'import json;print(json.load(open("release/build-manifest.json"))["commit"])')
            S=$(sha256sum "$(ls release/*.fwsc | head -1)" | cut -d" " -f1)
            # the site serves the release's emulator, so that is the commit to expect -- not this run's
            EXPECT=(--expect-emu-commit "$R" --expect-commit "$R" --expect-sha256 "$S")
            echo "expecting the signed release ${S:0:16} from ${R:0:7} and its emulator"
          else
            EXPECT=(--expect-emu-commit "$GITHUB_SHA" --expect-commit "$GITHUB_SHA")
            echo "expecting this run's package and emulator at ${GITHUB_SHA:0:7}"
          fi
          sleep 20                                   # Pages switches after the deploy reports, not during it
          for i in $(seq 1 20); do
            if python3 tools/site_check.py "${EXPECT[@]}"; then exit 0; fi
            echo "::notice::the site is not serving the expected artefacts yet (attempt $i/20); waiting 15 s"
            sleep 15
          done
          echo "::error::the deployed site still does not serve the expected artefacts after 5 minutes"
          exit 1
      # (M3.4) and /preview/ is this run, not last week's: it carries main's sources and the emulator
      # built from them, so its manifest must name this commit. Without this the channel could be stale
      # for weeks and nobody would know, which is exactly what happened to the root before.
      - name: the preview channel serves this run (main's emulator at /preview/)
        run: |
          BASE="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          WANT="${GITHUB_SHA:0:12}"
          for i in $(seq 1 20); do
            C=$(curl -fsS "$BASE/preview/emulator/manifest.json" 2>/dev/null \
                | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit",""))' 2>/dev/null) || C=""
            if [ "$C" = "$WANT" ]; then
              echo "preview: /preview/ serves $C"
              exit 0
            fi
            echo "::notice::/preview/ is not serving $WANT yet ($C, attempt $i/20); waiting 15 s"
            sleep 15
          done
          echo "::error::/preview/ still does not serve $WANT"
          exit 1

  # The signed package is committed under release/ because the private key is not: no workflow can sign,
  # and a package built by CI would carry no signature at all. This job publishes exactly the bytes that
  # were signed off-repo, after checking them, and refuses anything that does not describe this tree.
  # It lives here, next to the site, because this is the workflow that runs on every push to main.
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: is there anything to publish (the tag and the release already name this build)
        id: state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMIT=$(python3 -c 'import json;print(json.load(open("release/build-manifest.json"))["commit"])')
          HAVE=$(git rev-list -n1 v1.9.0 2>/dev/null || true)
          if [ "$HAVE" = "$COMMIT" ] && gh release view v1.9.0 >/dev/null 2>&1; then
            echo "v1.9.0 already is this build (${COMMIT:0:7}) and has a release: nothing to publish"
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "v1.9.0 is not this build yet (tag ${HAVE:-none}, package ${COMMIT:0:7}): publishing"
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
      # A job that cannot create a ref cannot publish anything, and the failure would look like a
      # signing problem. This says which permission is missing before the checks run. It creates one
      # tag and deletes it immediately; nothing else in the repository is touched.
      - name: this token may create refs and releases
        if: steps.state.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -s -o /tmp/probe.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/refs" \
            -d "{\"ref\":\"refs/tags/qg-ci-permission-probe\",\"sha\":\"$GITHUB_SHA\"}")
          if [ "$code" != "201" ]; then
            echo "::error::GITHUB_TOKEN cannot create a ref (HTTP $code). Settings > Actions > General > Workflow permissions must be 'Read and write permissions'; with the repository default (read-only) no workflow can publish a tag or a release."
            exit 1
          fi
          curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/refs/tags/qg-ci-permission-probe" >/dev/null
          echo "the token can create refs: publishing is possible from this job"
      - name: the committed release is signed by the pinned key and describes this tree
        if: steps.state.outputs.needed == 'true'
        run: |
          # Ubuntu 24.04 marks its system Python as externally managed, so a bare `pip install` fails
          # there; a venv is the reliable way to get `cryptography` for the verifier.
          PY=python3
          if ! python3 -c 'import cryptography' >/dev/null 2>&1; then
            python3 -m venv /tmp/qgvenv && /tmp/qgvenv/bin/pip install --quiet cryptography
            PY=/tmp/qgvenv/bin/python
          fi
          "$PY" tools/fm1_sign.py verify release/felucca-v1.9.0.fwsc \
              --manifest release/felucca-v1.9.0.manifest.json \
              --build-manifest release/build-manifest.json
      - name: hashes, identity, version and the record agree with the files
        if: steps.state.outputs.needed == 'true'
        run: |
          python3 - <<'PY'
          import hashlib, json, subprocess, sys
          pkg, man, rec = "release/felucca-v1.9.0.fwsc", "release/felucca-v1.9.0.manifest.json", "release/build-manifest.json"
          raw = open(pkg, "rb").read(); sha = hashlib.sha256(raw).hexdigest()
          m, r = json.load(open(man)), json.load(open(rec))
          sums = {}
          for line in open("release/SHA256SUMS", encoding="utf-8"):
              if line.strip():
                  h, name = line.split(); sums[name] = h
          def need(cond, why):
              if not cond:
                  sys.exit(f"::error::{why}")
          need(m["sha256"] == sha, "the signature does not describe these bytes")
          need(m["size"] == len(raw), "the signed size is not the file's size")
          need(m["version"] == "1.9.0" and r["version"].lstrip("v") == "1.9.0", "the version is not 1.9.0")
          need(m["product"] == "FM-1" and r["identity"] == "FM-1_982", "the identity is not FM-1_982")
          need(r["dirty"] == [], "the record says the tree was dirty")
          need(sums.get("felucca-v1.9.0.fwsc") == sha, "SHA256SUMS disagrees with the package")
          need(sums.get("felucca-v1.9.0.manifest.json") == hashlib.sha256(open(man, "rb").read()).hexdigest(),
               "SHA256SUMS disagrees with the manifest")
          need(r["artifacts"]["felucca.fwsc"]["sha256"] == sha, "the build record names another package")
          need(r["artifacts"]["felucca.fwsc"]["bytes"] == len(raw), "the build record has another size")
          subprocess.run(["git", "merge-base", "--is-ancestor", r["commit"], "HEAD"], check=True)
          changed = subprocess.run(["git", "diff", "--name-only", f'{r["commit"]}..HEAD', "--",
                                    "firmware", "tools", "web/emu"], capture_output=True, text=True).stdout.strip()
          need(not changed, f"the source changed after the build: {changed}")
          print(f"release: {sha} v1.9.0 FM-1_982 from {r['commit'][:7]}, signature and record agree")
          PY
      - name: tag v1.9.0 at the commit the package was built from
        if: steps.state.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMIT=$(python3 -c 'import json;print(json.load(open("release/build-manifest.json"))["commit"])')
          if git rev-parse -q --verify refs/tags/v1.9.0 >/dev/null; then
            HAVE=$(git rev-list -n1 v1.9.0)
            [ "$HAVE" = "$COMMIT" ] || { echo "::error::v1.9.0 already points at $HAVE, the package was built at $COMMIT"; exit 1; }
            echo "tag v1.9.0 already points at the record's commit"
          else
            # An annotated tag needs a committer and a fresh runner has no identity: `git tag -a` died
            # with "empty ident name (for <runner@...>) not allowed", which is why every earlier run
            # left no tag behind -- the rest of the job had already passed. The identity is the
            # workflow's, not a person's.
            git -c user.name="qg1 release" -c user.email="qg1-release@users.noreply.github.com" \
              tag -a v1.9.0 "$COMMIT" -m "Quantum GammaWave v1.9.0"
            # the checkout's token pushes the tag; the API is the fallback when it cannot, and it is
            # the same trust decision either way: the tag points at the commit the package names
            git push origin refs/tags/v1.9.0 ||
              gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v1.9.0" -f sha="$COMMIT" >/dev/null
            echo "tag v1.9.0 created at $COMMIT"
          fi
      - name: the GitHub Release carries the signed package, its manifest and the record
        if: steps.state.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILES="release/felucca-v1.9.0.fwsc release/felucca-v1.9.0.manifest.json release/build-manifest.json release/SHA256SUMS"
          if gh release view v1.9.0 >/dev/null 2>&1; then
            gh release upload v1.9.0 $FILES --clobber
          else
            gh release create v1.9.0 $FILES --title "Quantum GammaWave v1.9.0" \
              --notes-file docs/RELEASE_NOTES_v1.9.0.md
          fi
      - name: the published assets are the files that were verified
        if: steps.state.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/dl && gh release download v1.9.0 --dir /tmp/dl --clobber
          cd /tmp/dl && sha256sum -c "$GITHUB_WORKSPACE/release/SHA256SUMS"
          PY=python3
          python3 -c 'import cryptography' >/dev/null 2>&1 || PY=/tmp/qgvenv/bin/python
          "$PY" "$GITHUB_WORKSPACE/tools/fm1_sign.py" verify felucca-v1.9.0.fwsc \
              --manifest felucca-v1.9.0.manifest.json --build-manifest build-manifest.json
