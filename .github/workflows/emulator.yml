# SPDX-License-Identifier: GPL-3.0-only
# The browser emulator (web/emu) on GitHub Pages: the firmware's sources compiled to WebAssembly, on every push to
# main. Needs Settings > Pages > Source: "GitHub Actions" once. The emulator needs only the generated headers; the
# installer (webapp/installer) and the editor (webapp/editor) need the package, built with JieLi's toolchain (downloaded).
# (JIANT 0.6.61) Two channels: the emulator and preview/webapp/installer are main as it is now (to check before anyone
# installs it); webapp/installer, the one people use, is the version approved in web/STABLE (a commit of main, set by
# a PR once the preview was checked in the emulator). No web/STABLE yet: main, as before.
name: emulator
# (QG-1) Also on every other push and pull request that touches the firmware, the page or the tools: the emulator
# built and smoke-tested (web/emu/emu_test.mjs) and kept as an artifact (emulator-<sha>) to download and open; only
# main goes up to Pages.
on:
  push:
    paths: ["firmware/**", "web/**", "tools/**", "tests/target_budget.txt", "tests/target_budget.py", "build.sh",
            ".github/workflows/emulator.yml"]
  pull_request:
    paths: ["firmware/**", "web/**", "tools/**", "tests/target_budget.txt", "tests/target_budget.py", "build.sh",
            ".github/workflows/emulator.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                 # (web/STABLE's commit: built for the public installer)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install Pillow numpy fonttools cryptography
      - name: generated headers (fonts, icons, palettes, shapes, tables, samples)
        run: python3 -c "import sys; sys.path.insert(0, 'tools'); import build; build.generate()"
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.11                # (the version the emulator is tested with)
      - name: the emulator
        env:
          EMU_PREVIEW: "0"
        run: sh web/emu/build.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: the emulator boots, plays, saves (smoke test; the cost check relaxed for shared runners)
        run: BENCH_MAX=1.5 node web/emu/emu_test.mjs build/emu/felucca.wasm
      - name: the emulator as an artifact (every branch, every PR)
        uses: actions/upload-artifact@v4
        with:
          name: emulator-${{ github.sha }}
          path: build/emu
          retention-days: 14
      # (JIANT) the installer and the web editor next to the emulator: the package needs JieLi's toolchain (downloaded)
      # and three files of their AC79 SDK (a partial clone: only those blobs). If any of it fails the emulator still
      # goes up. (QG-1 stage 3) On every pull request too: the DSP budget and the .fwsc reader need the target
      # compiler, and a PR is exactly where a render loop or the package reader can regress.
      - name: JieLi toolchain and SDK files (cached)
        uses: actions/cache@v4
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK/cpu/wl82/tools
          key: jieli-ac79-v1
      - name: JieLi toolchain and SDK files
        id: tc
        continue-on-error: true
        env:
          # (QG-1 stage 3) the reviewed SHA-256 of the toolchain archive (Settings > Variables). Empty: the
          # download still runs and prints the hash it got, so the value can be reviewed and set
          JIELI_TOOLCHAIN_SHA256: ${{ vars.JIELI_TOOLCHAIN_SHA256 }}
        run: |
          # gitee resets connections from the runners now and then: retries with backoff; the cache above keeps them
          retry() { for d in 0 5 15 30 60; do sleep $d; "$@" && return 0; done; return 1; }
          T=$HOME/fw-AC79_AIoT_SDK/cpu/wl82/tools
          [ -e "$HOME/.jieli/toolchain" ] || retry sh tools/get_toolchain.sh "$HOME/.jieli"
          if [ ! -s "$T/uboot.boot" ] || [ ! -s "$T/cfg_tool.bin" ] || [ ! -s "$T/cfg/eq_cfg_hw.bin" ]; then
            rm -rf "$HOME/fw-AC79_AIoT_SDK"
            retry git clone --filter=blob:none --no-checkout --depth 1 https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK"
            cd "$HOME/fw-AC79_AIoT_SDK" && git sparse-checkout set --no-cone /cpu/wl82/tools/uboot.boot /cpu/wl82/tools/cfg_tool.bin \
              /cpu/wl82/tools/cfg/eq_cfg_hw.bin && retry git checkout
          fi
          test -s "$T/uboot.boot" && test -s "$T/cfg_tool.bin" && test -s "$T/cfg/eq_cfg_hw.bin"
      - name: the package, the installer and the editor
        if: steps.tc.outcome == 'success'
        continue-on-error: true
        env:
          AC79_SDK: /home/runner/fw-AC79_AIoT_SDK
          JIELI_TOOLCHAIN: /home/runner/.jieli/toolchain
        run: |
          # the label the site shows must be the build record's version plus the commit it was built
          # from, and nothing else: make_site.py refuses anything but "v1.9.0-8549ed4". FELUCCA_VERSION
          # already carries the leading v, so ver() returns it as written; the old label appended
          # "-preview" and every site build was refused.
          ver() { sed -n 's/^#define FELUCCA_VERSION "\([^"]*\)".*/\1/p' "$1/firmware/src/felucca.c" | head -1; }
          # the preview: main as it is now, next to the emulator that runs it (preview/webapp/installer)
          python3 tools/build.py
          V=$(ver .)
          python3 web/make_site.py build/felucca.fwsc "${V:-dev}-${GITHUB_SHA::7}" build/site_preview \
            --emu build/emu/manifest.json
          mkdir -p build/site_preview/emulator
          cp -r build/emu/. build/site_preview/emulator/
          # (3.3) This step only builds what the ARTIFACT carries: the preview bundle for a downloaded
          # emulator. The published site is assembled in its own step below.
          rm -rf build/emu/preview
          mkdir -p build/emu/preview
          cp -r build/site_preview/. build/emu/preview/
      # (v2.1.1) A build in CI is a candidate, not a release: the signing key is not here and never will be. This
      # freezes the bytes into a qg1-sign-request-1 document -- package hash and size, the firmware image hashes,
      # the build record, the version and a timestamp -- which a custodian signs where the key lives, offline or
      # on a host reachable only by them, and commits back as release/PACKAGE.fwsc.manifest.json. CI then verifies
      # that signature with the public pin before anything is published. When the version is already signed there
      # is nothing to ask for.
      - name: the build as a signing request (the key is not in CI)
        if: steps.tc.outcome == 'success'
        continue-on-error: true
        run: |
          ver() { sed -n 's/^#define FELUCCA_VERSION "\([^"]*\)".*/\1/p' "$1/firmware/src/felucca.c" | head -1; }
          V=$(ver .); V=${V#v}
          if [ -f "release/felucca-$V.fwsc.manifest.json" ]; then
            echo "release/$V is already signed: no request to make"
            exit 0
          fi
          KID=$(python3 -c "import json;k=json.load(open('tools/fm1_keys.json')).get('keys') or {};print(sorted(k)[0] if k else '')")
          [ -n "$KID" ] || { echo "::warning::no key is pinned: a request would name no key id"; exit 0; }
          python3 tools/fm1_sign.py request build/felucca.fwsc --version "$V" --min 1.0.0 --keyid "$KID" \
            --build-manifest build/manifest.json --out build/sign-request.json
      - name: the signing request as an artifact
        if: steps.tc.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: sign-request-${{ github.sha }}
          path: build/sign-request.json
          if-no-files-found: ignore
          retention-days: 14
      # (QG-1 stage 2/3) the two checks that need the target compiler, on main and on every PR. On main the step
      # above has just built the package; on a PR (no site, no deploy) this is the only build. Not
      # continue-on-error: a regression here is the point of running them.
      - name: target compiler checks (DSP budget of the render loops, the .fwsc reader on the package)
        if: steps.tc.outcome == 'success'
        env:
          AC79_SDK: /home/runner/fw-AC79_AIoT_SDK
          JIELI_TOOLCHAIN: /home/runner/.jieli/toolchain
        run: |
          if [ ! -s build/felucca.dis ] || [ ! -s build/felucca.fwsc ]; then python3 tools/build.py; fi
          python3 tests/target_budget.py build/felucca.dis tests/target_budget.txt
          node web/test_pkg_bounds.mjs build/felucca.fwsc
      # (QG-1 phase 2) The install gate is not a suggestion: both routes must refuse to start an update
      # without the physical NOR id. test_web.mjs counts the frames the simulated FM-1 receives, and
      # preflight_test.py does the same for the CLI (including a direct Updater.write()).
      - name: the install gate cannot be bypassed (CLI and web)
        if: steps.tc.outcome == 'success'
        run: |
          node web/test_web.mjs
          node web/test_verify_only.mjs
          python3 tests/preflight_test.py build/felucca.fwsc
          python3 tests/chip_test.py
          python3 tests/flash_evidence_test.py
          python3 tests/flash_read_test.py
          python3 tests/mflasher_test.py
      # (v2.0.0) The stable channel's emulator is built from the commit the signed package was built from, not
      # from main: the page that installs `release/felucca-2.0.0.fwsc` must run the code that produced those
      # bytes. main's emulator goes to /preview/, so "try it before installing" and "install it" are two
      # different, labelled things. A worktree keeps both in one job with one emsdk.
      # (v2.1.1) release/ holds every signed package now, and the one that counts is the newest by version, not
      # the first name in the directory: "felucca-2.0.0" sorts before "felucca-2.1.1", so the old selection kept
      # serving the previous release after the new one was signed. One selection feeds the emulator worktree, the
      # root site and the deploy check, so they cannot disagree about which release is live.
      - name: the newest signed release (package, version, commit)
        id: rel
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import glob, json
          def key(v):
              try: return tuple(int(x) for x in str(v).strip().lstrip("v").split("."))
              except (TypeError, ValueError): return (0,)
          best = None
          for m in glob.glob("release/*.manifest.json"):
              try: d = json.load(open(m))
              except (OSError, ValueError): continue
              if d.get("format") != "qg1-release-1" or not isinstance(d.get("images"), dict): continue
              k = key(d.get("version"))
              if best is None or k > best[0]: best = (k, m[:-len(".manifest.json")], d)
          if best is None:
              print("pkg="); print("version="); print("commit=")
          else:
              _, pkg, d = best
              print("pkg=" + pkg)
              print("version=" + str(d.get("version")))
              print("commit=" + str((d.get("build") or {}).get("commit", "")))
          EOF
          echo "newest signed release: '${{ steps.rel.outputs.version }}' (${{ steps.rel.outputs.pkg }})"
      - name: the emulator of the signed release's commit
        run: |
          REL="${{ steps.rel.outputs.commit }}"
          echo "release commit: '${REL}'"
          if [ -n "$REL" ]; then
            git worktree add ../release-tree "$REL"
            ( cd ../release-tree
              python3 -c "import sys; sys.path.insert(0, 'tools'); import build; build.generate()"
              EMU_PREVIEW=0 sh web/emu/build.sh )
            test -s ../release-tree/build/emu/felucca.wasm || { echo "::error::the release emulator did not build"; exit 1; }
            # the worktree's HEAD is $REL, so the record names it: package_emu.py reads the commit with
            # `git -C ROOT rev-parse`, which in a linked worktree can answer with the repository's gitdir
            # instead, and a record that names another build is exactly what the deploy check refuses.
            REL="$REL" python3 - <<'PYEOF'
          import json, os
          p = "../release-tree/build/emu/manifest.json"
          d = json.load(open(p))
          want = os.environ["REL"]
          if d.get("commit") != want:
              print(f"release emu record: {d.get('commit')} -> {want}")
              d["commit"] = want
              json.dump(d, open(p, "w"), indent=1)
          PYEOF
            echo "REL=$REL" >> "$GITHUB_ENV"
            echo "REL_EMU=$GITHUB_WORKSPACE/../release-tree/build/emu" >> "$GITHUB_ENV"
          fi
      # (QG-1) The portal and the emulator go up whether or not JieLi's toolchain could be downloaded in this
      # run. The package is the one built here when the target build ran, and the one committed in
      # firmware/packages otherwise -- never a guess, and never a rebuild that did not happen. Both carry their
      # own build record, and make_site.py refuses to publish a package that contradicts it (hash, size,
      # identity, the commit it names, the emulator that record names), so the gate is provenance, not luck.
      # It used to be "a target package must exist in THIS run": with gitee unreachable the job failed closed
      # and Pages never deployed, which is how twenty-two commits went unpublished.
      - name: the site (root = the signed release, /preview = this build)
        run: |
          ver() { sed -n 's/^#define FELUCCA_VERSION "\([^"]*\)".*/\1/p' "$1/firmware/src/felucca.c" | head -1; }
          SH=${GITHUB_SHA::7}
          SV=$(ver .)
          # the root: the signed release, its own emulator, its own build record -- and this run's emulator
          # only if the release manifest names it (it does not: it names the one built with the package, which
          # is ../release-tree/build/emu above).
          RELPKG="${{ steps.rel.outputs.pkg }}"
          RELVER="${{ steps.rel.outputs.version }}"
          if [ -n "${REL:-}" ] && [ -s "$REL_EMU/manifest.json" ] && [ -s "$RELPKG" ]; then
            python3 web/make_site.py "$RELPKG" "v${RELVER}-${REL:0:7}" \
              build/site --emu "$REL_EMU/manifest.json"
            mkdir -p build/site/emulator
            cp -r "$REL_EMU"/. build/site/emulator/
            echo "root: the signed release, emulator built from $REL"
          elif [ -s build/felucca.fwsc ]; then
            # no signed release in the tree (a branch without release/): this run's build, unsigned, and the
            # installer will say so. Never a guess.
            echo "::warning::no signed release in this tree: the root serves this run's unsigned build"
            python3 web/make_site.py build/felucca.fwsc "${SV}-${SH}" build/site --no-release --emu build/emu/manifest.json
            mkdir -p build/site/emulator
            cp -r build/emu/. build/site/emulator/
          else
            PKG=$(ls firmware/packages/*.fwsc 2>/dev/null | head -1)
            test -s "$PKG" || { echo "::error::no target package in this run and none committed in firmware/packages"; exit 1; }
            VS=$(basename "$PKG" .fwsc); VS=${VS#felucca-}
            python3 web/make_site.py "$PKG" "$VS" build/site --no-release --emu build/emu/manifest.json
            mkdir -p build/site/emulator
            cp -r build/emu/. build/site/emulator/
          fi
          rm -rf build/site/emulator/preview
          # /preview: main as it is now -- its package (not installable until signed), its emulator, its
          # record. Built only when the JieLi toolchain produced a package in this run.
          if [ -s build/felucca.fwsc ]; then
            python3 web/make_site.py build/felucca.fwsc "${SV}-${SH}" build/site/preview --no-release \
              --emu build/emu/manifest.json
            mkdir -p build/site/preview/emulator
            cp -r build/emu/. build/site/preview/emulator/
            rm -rf build/site/preview/emulator/preview
            echo "preview: ${SV}-${SH}"
          else
            echo "::warning::no target package in this run: /preview is not built"
          fi
      # Fail closed on what actually matters: a package was chosen and a site was written. Its provenance was
      # checked by make_site.py, which refuses a package that contradicts its own build record.
      - name: a package and a site exist (fail closed)
        if: always()
        run: |
          test -s build/felucca.fwsc || ls -l firmware/packages/*.fwsc || { echo "::error::no package anywhere"; exit 1; }
          test -s build/site/index.html || { echo "::error::the site was not built"; exit 1; }

      - name: the site exists (the deploy would otherwise upload nothing)
        run: |
          ls -la build | head -20
          test -s build/site/index.html || { echo "::error::build/site/index.html is missing, nothing to publish"; exit 1; }
      # (M3.4) main only. The public site is one artefact and Pages keeps the last one published, so a
      # side branch that deployed could (and did) put an older tree back over main's: the site went from
      # the new build back to v1.9.0-7eb9636 with no push to main in between. A branch that wants to be
      # seen publishes an artifact, not the site.
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: build/site
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      # (QG-1 stage 2) deploy-pages fails with "Get Pages site failed (404)" when Pages has never been
      # enabled, and GitHub does not let the job's own token create the site: say what to do instead
      - name: "Pages is enabled (Settings > Pages > Build and deployment > Source: GitHub Actions)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh api "repos/${{ github.repository }}/pages" > /tmp/pages.json 2>/dev/null; then
            echo "::error::GitHub Pages is not enabled for ${{ github.repository }}: deploy-pages would fail with HTTP 404. Enable it once, Settings > Pages > Build and deployment > Source: GitHub Actions (no workflow change is needed)."
            exit 1
          fi
          echo "Pages: $(tr -d '\n' < /tmp/pages.json)"
      - id: deployment
        uses: actions/deploy-pages@v4
      # Pages answers "Deployment failed, try again later." from deployment_failed, a terminal status the
      # action stops polling on: the artifact is fine and the build job is green (runs 42261322522 and
      # 42267114599 both died here, after the site had been built and uploaded). A second attempt is what
      # GitHub's own issue tracker recommends for this status, and it is the only retry this workflow makes.
      - name: Deploy to GitHub Pages (one retry, Pages' deployment_failed is transient)
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
      # A deploy that reported success is not a site that serves this commit: Pages can take a moment to
      # switch over, and the previous artifact stays up until it does. This reads the published origin
      # and holds versions.json, the package, the emulator manifest, the wasm, the portal and the
      # installer to this run's commit, retrying while the switch happens rather than sampling once.
      # (the deploy job never checked the repository out: without this the check could not even run,
      # and run 42276334594 failed on a script that was not there while the site was serving the commit)
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/site_check.py
            release
          sparse-checkout-cone-mode: false
      - name: the published site serves the signed release (root) and this build (/preview)
        run: |
          # the root installs the signed release, so what it must serve is that release's commit, not this
          # run's: main moves, the signature does not.
          REL=$(python3 - <<'EOF'
          import glob, json
          def key(v):
              try: return tuple(int(x) for x in str(v).strip().lstrip("v").split("."))
              except (TypeError, ValueError): return (0,)
          best = None
          for m in glob.glob("release/*.manifest.json"):
              try: d = json.load(open(m))
              except (OSError, ValueError): continue
              k = key(d.get("version"))
              if best is None or k > best[0]: best = (k, d)
          print(((best[1].get("build") or {}).get("commit", "")) if best else "")
          EOF
          )
          echo "the signed release was built from '${REL:-nothing}'"
          [ -n "$REL" ] || { echo "::error::no signed release manifest in the tree: the root would serve an unsigned build"; exit 1; }
          sleep 20                                   # Pages switches after the deploy reports, not during it
          for i in $(seq 1 20); do
            if python3 tools/site_check.py --expect-emu-commit "$REL" --expect-commit "$REL"; then
              exit 0
            fi
            echo "::notice::the site is not serving the expected artefacts yet (attempt $i/20); waiting 15 s"
            sleep 15
          done
          echo "::error::the deployed site still does not serve the expected artefacts after 5 minutes"
          exit 1
      # (M3.4) and /preview/ is this run, not last week's: it carries main's sources and the emulator
      # built from them, so its manifest must name this commit. Without this the channel could be stale
      # for weeks and nobody would know, which is exactly what happened to the root before.
      - name: the preview channel serves this run (main's emulator at /preview/)
        run: |
          BASE="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          WANT="${GITHUB_SHA:0:12}"
          for i in $(seq 1 20); do
            C=$(curl -fsS "$BASE/preview/emulator/manifest.json" 2>/dev/null \
                | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit",""))' 2>/dev/null) || C=""
            if [ "$C" = "$WANT" ]; then
              echo "preview: /preview/ serves $C"
              exit 0
            fi
            echo "::notice::/preview/ is not serving $WANT yet ($C, attempt $i/20); waiting 15 s"
            sleep 15
          done
          echo "::error::/preview/ still does not serve $WANT"
          exit 1
