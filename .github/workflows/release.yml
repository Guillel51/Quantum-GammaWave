# Quantum GammaWave — official Firmware Hub release.
# Builds, signs and attests the .fwsc on every version tag, using the shared
# zvenson/fm1-build workflow so the Hub grants "Built from source on GitHub".
#
# The pin below IS the hub's reviewed tag `v1`: `git ls-remote` on 2026-11-12 read
#   refs/tags/v1    5ba8c359b1744cc53c4530b15eff52d0d5c1255b   (annotated tag object)
#   refs/tags/v1^{} 85a003ab455b1c074b0bd6d7c282c096a464b973   (the commit it points at)
# and the job names that commit, not the tag: a tag is a mutable ref in someone else's repository
# and this job hands it contents:write, id-token:write and the release itself. Bump the sha
# deliberately, after reading the diff, never by moving a tag. The hub's badge names the commit,
# so publishing from this sha is publishing from v1 as reviewed.
name: release
on:
  # Only a version tag builds and attests a release. A push to main is covered by target.yml;
  # building from a branch here made GITHUB_REF_NAME=main the "version" the package was cut
  # with, and the shared workflow's release path is tag-only by design.
  push:
    tags: ["v*"]
  # A tag created by a workflow with `GITHUB_TOKEN` starts no run, so `tag-and-publish.yml` re-creates
  # that link by dispatching this workflow after it makes the tag. The tag is named in `tag`, never taken
  # from the ref: the workflow file is read AT THE REF IT IS DISPATCHED AT, so a tag whose tree predates
  # this trigger (every 1.3.x, whose releases shipped without an attestation) could never be dispatched at
  # the tag itself. Dispatched on the default branch, every job checks the named tag out.
  workflow_dispatch:
    inputs:
      tag:
        description: "the version tag to build and attest (vX.Y.Z; it has to exist already)"
        required: true
        type: string

# One run per version: a re-dispatch waits for the one in flight instead of racing it.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

# The audit trail in the Actions tab names the version, so a dispatch and a tag push look the same there
# and `tag-and-publish.yml` can tell whether a version was already attested.
run-name: release ${{ inputs.tag || github.ref_name }}
jobs:
  # The 3.0 plan forbids assigning, tagging or publishing it before the phases and the physical
  # checks are complete. A manually pushed 3.x tag must not reach the shared build either.
  gate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: the version this run builds, and the tree agrees with its tag
        id: ver
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          V=$(sed -n 's/^#define FELUCCA_VERSION "\([^"]*\)".*/\1/p' firmware/src/felucca.c | head -1)
          test "$TAG" = "$V" || { echo "::error::the tag is $TAG and this tree's FELUCCA_VERSION is $V: refusing to attest one version under another's name"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "building and attesting $V from its tag"
      - name: a 3.x release needs an explicit approval
        env:
          QG_RELEASE_APPROVED: ${{ vars.QG_RELEASE_APPROVED }}
        run: |
          set -euo pipefail
          python3 tools/release_gate.py "${{ steps.ver.outputs.version }}" "${QG_RELEASE_APPROVED:-false}"
  build:
    needs: gate
    uses: zvenson/fm1-build/.github/workflows/build.yml@85a003ab455b1c074b0bd6d7c282c096a464b973
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      # The calling run is a dispatch on the default branch (or a tag push), so the checkout is that ref: the
      # first thing the build does is fetch the version's tag and move to it, and from there nothing but the
      # tag's tree is built. `--depth=1` on the tag keeps the fetch small and still puts the annotated tag's
      # commit in place. The tag is a name the gate already proved matches the version inside felucca.c.
      build: |
        set -euo pipefail
        V="${{ needs.gate.outputs.version }}"
        git fetch --no-tags --depth=1 origin "refs/tags/$V:refs/tags/$V"
        git checkout -q "refs/tags/$V"
        test "$(sed -n 's/^#define FELUCCA_VERSION "\([^"]*\)".*/\1/p' firmware/src/felucca.c | head -1)" = "$V"
        echo "building $(git describe --tags --always) ($(git rev-parse HEAD))"
        python3 -m pip install --quiet Pillow fonttools numpy
        ./build.sh --release "${V#v}"
      packages: build/*.fwsc
      # blocking: the host suite, then the installer, the package bounds and the provenance gate. A
      # package is never attested from a tree that failed any of these (tests-block fails the job).
      # Each stage is named: the job log needs a credential to read, but an `::error` annotation does not,
      # so a failure says which of the six it was and carries the tail of that stage in the annotation.
      test: |
        stage() {
          name="$1"; shift
          log=/tmp/stage.log
          if "$@" > "$log" 2>&1; then
            echo "ok: $name"
          else
            echo "FAILED: $name -- the failing lines, then the last 20"
            bad=$(grep -nE 'FAIL|MISMATCH|not ok|ERROR|Error:|assert' "$log" | head -10)
            [ -n "$bad" ] || bad=$(tail -20 "$log")
            echo "$bad"
            tail -20 "$log"
            # The annotation carries the failing lines: 900 characters of them, one per line.
            printf '::error title=tests failed: %s::%s\n' "$name" \
              "$(printf '%s\n' "$bad" | head -12 | cut -c1-120 | sed 's/%/%25/g; s/\r//g' | tr '\n' '|')"
            exit 1
          fi
        }
        stage "host suite" env NO_PACKAGE=1 sh tests/run_tests.sh
        stage "installer" python3 tests/install_test.py
        stage "web" node web/test_web.mjs
        stage "backup" node web/test_backup.mjs
        stage "package bounds" node web/test_pkg_bounds.mjs
        stage "provenance" node web/test_provenance.mjs
      tests-block: true
      sdk: true

  # 7. The package is checked the way a player's browser checks it, and it is THE SAME FILE the other
  # path names: `tag-and-publish.yml` attests `release/felucca-<version>.fwsc` from the tree, so this job
  # verifies exactly that path and then proves the release carries those bytes. It used to verify
  # "whatever *.fwsc the release had", which is a different subject whenever the built package and the
  # committed one drift -- and that drift is precisely what these two workflows exist to catch. Nothing is
  # rebuilt, replaced or uploaded here; a mismatch fails the run.
  verify:
    needs: [gate, build]
    if: ${{ github.ref_type == 'tag' || inputs.tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.version }}
      - name: The package this tree commits for this version
        id: pkg
        run: |
          set -euo pipefail
          V="${{ needs.gate.outputs.version }}"
          test "$(sed -n 's/^#define FELUCCA_VERSION "\([^"]*\)".*/\1/p' firmware/src/felucca.c | head -1)" = "$V"
          P="release/felucca-${V}.fwsc"
          test -s "$P" || { echo "::error::$P is missing: nothing to verify against the attestation"; exit 1; }
          echo "path=$P" >> "$GITHUB_OUTPUT"
          echo "verifying $P ($(sha256sum "$P" | cut -d' ' -f1))"
      - name: Download the release's package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p dist
          gh release download "${{ needs.gate.outputs.version }}" --repo "$GITHUB_REPOSITORY" --pattern '*.fwsc' --dir dist
          ls -l dist
          sha256sum dist/*.fwsc
      - name: The release carries the very bytes this tree commits
        run: |
          set -euo pipefail
          P="${{ steps.pkg.outputs.path }}"
          n=0
          for f in dist/*.fwsc; do
            n=$((n + 1))
            if cmp -s "$f" "$P"; then
              echo "ok    $f is byte-identical to $P"
              continue
            fi
            echo "::error::$f is not the committed $P: the release would serve bytes no attestation of this tree covers"
            sha256sum "$f" "$P"
            exit 1
          done
          test "$n" -gt 0 || { echo "::error::the release carries no .fwsc"; exit 1; }
      - name: Verify the attestation of those bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh attestation verify "${{ steps.pkg.outputs.path }}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow zvenson/fm1-build/.github/workflows/build.yml
      - name: The identity inside the bytes is this firmware's own
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh attestation verify "${{ steps.pkg.outputs.path }}" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow zvenson/fm1-build/.github/workflows/build.yml --format json > attestation.json
          python3 tools/check_package_identity.py "${{ steps.pkg.outputs.path }}"
