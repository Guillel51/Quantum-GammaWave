# Quantum GammaWave — official Firmware Hub release.
# Builds, signs and attests the .fwsc on every version tag, using the shared
# zvenson/fm1-build workflow so the Hub grants "Built from source on GitHub".
name: release
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:
jobs:
  build:
    # pinned to the commit v1 pointed at on 2026-10-18 (85a003ab): a tag is a mutable ref in someone else's
    # repository, and this job hands it contents:write, id-token:write and the release itself. Bump the sha
    # deliberately, after reading the diff, never by moving a tag.
    uses: zvenson/fm1-build/.github/workflows/build.yml@85a003ab455b1c074b0bd6d7c282c096a464b973
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      build: V="$(sed -n 's/^#define FELUCCA_VERSION "v\?\([0-9][^"]*\)".*/\1/p' firmware/src/felucca.c | head -1)"; pip install --quiet Pillow fonttools numpy && ./build.sh --release "$V"
      packages: build/*.fwsc
      test: sh tests/run_tests.sh
      tests-block: true
      sdk: true
