name: release

# The signed package is committed under release/ because the private key is not: no workflow can sign,
# and a release built by CI would carry no signature at all. This job therefore publishes exactly the
# bytes a human signed off-repo, after checking them, and refuses anything that does not match the tree.

on:
  push:
    branches: [main]
    paths:
      - "release/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: the committed release is signed by the pinned key and describes this tree
        run: |
          python3 -m pip install --quiet cryptography
          python3 tools/fm1_sign.py verify release/felucca-v1.9.0.fwsc \
              --manifest release/felucca-v1.9.0.manifest.json \
              --build-manifest release/build-manifest.json

      - name: hashes, identity, version and the record agree with the files
        run: |
          python3 - <<'PY'
          import hashlib, json, subprocess, sys
          pkg = "release/felucca-v1.9.0.fwsc"
          man = "release/felucca-v1.9.0.manifest.json"
          rec = "release/build-manifest.json"
          raw = open(pkg, "rb").read()
          sha = hashlib.sha256(raw).hexdigest()
          m, r = json.load(open(man)), json.load(open(rec))
          sums = {}
          for line in open("release/SHA256SUMS", encoding="utf-8"):
              if line.strip():
                  h, name = line.split()
                  sums[name] = h
          def need(cond, why):
              if not cond:
                  sys.exit(f"::error::{why}")
          need(m["sha256"] == sha, "the signature does not describe these bytes")
          need(m["size"] == len(raw), "the signed size is not the file's size")
          need(m["version"] == r["version"] == "v1.9.0", "the version is not v1.9.0")
          need(r["identity"] == m["product"] == "FM-1_982", "the identity is not FM-1_982")
          need(r["dirty"] == [], "the record says the tree was dirty")
          need(sums.get("felucca-v1.9.0.fwsc") == sha, "SHA256SUMS disagrees with the package")
          need(sums.get("felucca-v1.9.0.manifest.json") == hashlib.sha256(open(man,"rb").read()).hexdigest(),
               "SHA256SUMS disagrees with the manifest")
          need(r["artifacts"]["felucca.fwsc"]["sha256"] == sha, "the build record names another package")
          need(r["artifacts"]["felucca.fwsc"]["bytes"] == len(raw), "the build record has another size")
          subprocess.run(["git", "merge-base", "--is-ancestor", r["commit"], "HEAD"], check=True,
                         stderr=subprocess.DEVNULL)
          # the package must describe the firmware in this tree: nothing may have changed under the
          # paths that feed the firmware or the emulator since the commit it was built from
          changed = subprocess.run(["git", "diff", "--name-only", f'{r["commit"]}..HEAD', "--",
                                    "firmware", "tools", "web/emu"], capture_output=True, text=True).stdout.strip()
          need(not changed, f"the source changed after the build: {changed}")
          print(f"release: {sha} v1.9.0 FM-1_982 from {r['commit'][:7]}, signature and record agree")
          PY

      - name: tag v1.9.0 at the commit the package was built from
        run: |
          COMMIT=$(python3 -c 'import json;print(json.load(open("release/build-manifest.json"))["commit"])')
          if git rev-parse -q --verify refs/tags/v1.9.0 >/dev/null; then
            HAVE=$(git rev-list -n1 v1.9.0)
            if [ "$HAVE" != "$COMMIT" ]; then
              echo "::error::v1.9.0 already points at $HAVE, the package was built at $COMMIT"; exit 1
            fi
            echo "tag v1.9.0 already points at the record's commit"
          else
            git tag -a v1.9.0 "$COMMIT" -m "Quantum GammaWave v1.9.0 (package sha256 $(python3 -c 'import json;print(json.load(open("release/felucca-v1.9.0.manifest.json"))["sha256"])'))"
            git push origin refs/tags/v1.9.0
            echo "tag v1.9.0 created at $COMMIT"
          fi

      - name: the GitHub Release carries the signed package, its manifest and the record
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILES="release/felucca-v1.9.0.fwsc release/felucca-v1.9.0.manifest.json release/build-manifest.json release/SHA256SUMS"
          if gh release view v1.9.0 >/dev/null 2>&1; then
            gh release upload v1.9.0 $FILES --clobber
          else
            gh release create v1.9.0 $FILES \
              --title "Quantum GammaWave v1.9.0" \
              --notes-file docs/RELEASE_NOTES_v1.9.0.md
          fi

      - name: the published assets are the files that were verified
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/dl && gh release download v1.9.0 --dir /tmp/dl --clobber
          cd /tmp/dl && sha256sum -c "$GITHUB_WORKSPACE/release/SHA256SUMS"
          python3 "$GITHUB_WORKSPACE/tools/fm1_sign.py" verify felucca-v1.9.0.fwsc \
              --manifest felucca-v1.9.0.manifest.json \
              --build-manifest build-manifest.json
