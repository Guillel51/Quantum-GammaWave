# SPDX-License-Identifier: GPL-3.0-only
# Quantum GammaWave — the committed site, checked. It is not deployed from here.
#
# There used to be two publishers of GitHub Pages: this workflow uploaded `site/` exactly as committed, and
# `emulator.yml` uploaded `build/site`, the site it builds from the same tree (with the live `/preview/`
# channel). Both targeted the same Pages site, in two different concurrency groups, so the last one to finish
# won: the deployed front page could be the committed copy or the built one, and the two name the version
# differently (`1.3.8` against `v1.3.8-<sha>`) -- measured on the live site. A deploy is one artefact, so
# there is now one publisher: `emulator.yml`, which builds it. This job keeps what the second publisher was
# good at -- refusing a committed `site/` that contradicts the package -- and writes nothing.
name: pages

on:
  push:
    branches: ["main"]
    paths: ["site/**", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: the committed site is the release set's
        run: |
          set -euo pipefail
          # The same check the host suite and the pre-flight run: package, both sums files, versions.json,
          # the portal, the installer's meta and the emulator records all describe one package.
          python3 tools/make_release.py --check
          python3 tools/coherence_check.py

      - name: the portal, its links and its images
        run: |
          set -euo pipefail
          test -s site/index.html || { echo "::error::site/index.html is empty: Pages would serve a blank page"; exit 1; }
          python3 web/test_site.py site

      # The deployment itself is emulator.yml's: `pages.yml` is a second publisher, and two publishers of one
      # Pages site are a race, not a backup. If the deployed site has to be checked against the tree, that is
      # `tools/site_check.py --url`, which the deploy job already runs after its own upload.
