# SPDX-License-Identifier: GPL-3.0-only
# Quantum GammaWave — the public site, deployed from the tree.
#
# There was no Pages workflow in this repository, so the deployment GitHub Pages was serving had frozen at
# an old build (the root still answered with a v1.4-QG preview page that no file here produces). This job
# publishes the `site/` directory exactly as committed: the portal, the installer, the Web Studio and the
# emulator, with the package and manifest that `web/make_site.py` wrote into it. Nothing is generated here,
# so what is deployed is what the repository holds and what `tools/coherence_check.py` verified.
name: pages

on:
  push:
    branches: ["main"]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: the package the portal serves is the one the release carries
        run: |
          set -euo pipefail
          V=$(sed -n 's/^#define FELUCCA_VERSION "\([^"]*\)".*/\1/p' firmware/src/felucca.c | head -1)
          P="release/felucca-${V}.fwsc"
          test -s "$P"
          test -s "site/firmware/felucca-${V#v}.fwsc" || test -s "site/firmware/felucca-${V}.fwsc"
          # the tree's own consistency, before it is published: site_check compares a URL with the files, so
          # it runs after the deployment below, not before it (before, it validated yesterday's site).
          python3 - "$V" <<'PY'
          import json, sys
          v = sys.argv[1]
          top = json.load(open("site/firmware/versions.json"))
          if isinstance(top, dict):
              top = top.get("versions", [top])
          names = [str(e.get("version")) for e in top if isinstance(e, dict)]
          names = ["v" + n if not n.startswith("v") else n for n in names]
          assert v in names, (v, names[:4])
          print("the portal offers", v)
          PY

      - name: the emulator served is the one the build record names
        run: |
          set -euo pipefail
          cp -r release/emu/. site/emulator/
          python3 - <<'PY'
          import json
          e = json.load(open("site/emulator/manifest.json"))
          b = json.load(open("release/emu/manifest.json"))
          assert e["version"] == b["version"] and e["wasm_sha256"] == b["wasm_sha256"], (e, b)
          print("emulator", e["version"], e["commit"], e["wasm_sha256"][:12])
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: the deployment answers with this tree
        run: python3 tools/site_check.py --url "${{ steps.deployment.outputs.page_url }}"
