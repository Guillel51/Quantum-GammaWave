# SPDX-License-Identifier: GPL-3.0-only
# Quantum GammaWave — the tag and the release, created by the runner.
#
# `release.yml` builds and attests on a tag push, but nothing in this repository ever created that tag:
# every release so far needed a person with a credential to push `vX.Y.Z` by hand, which is why a version
# could be served by Pages for hours with no GitHub Release behind it. This job closes that link.
#
# It only publishes what the tree already commits: the package in `release/` that names this version is
# verified against its own manifest first (`fm1_sign.py verify`: hash, size, product, images, build record),
# so a release can never be cut from a guessed or stale artefact. The tag is annotated at the commit that
# carries that package, the package itself is attested, and `gh release create --verify-tag` refuses to
# create a release for a tag that does not exist.
#
# It is idempotent: an existing tag or release is reported and left alone, never moved and never overwritten.
name: tag and publish

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: tag-and-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: the version the firmware carries
        id: ver
        run: |
          set -euo pipefail
          V=$(sed -n 's/^#define FELUCCA_VERSION "\([^"]*\)".*/\1/p' firmware/src/felucca.c | head -1)
          case "$V" in
            v[0-9]*) ;;
            *) echo "::error::FELUCCA_VERSION '${V}' is not a release version"; exit 1 ;;
          esac
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "package=release/felucca-${V}.fwsc" >> "$GITHUB_OUTPUT"
          echo "version the tree carries: $V"

      # The 3.0 plan forbids assigning, tagging or publishing it until every phase, the target
      # build and the physical checks are done. This is the one gate both publish paths call;
      # the approval is a repository variable, never a value in the tree.
      - name: a 3.x release needs an explicit approval
        env:
          QG_RELEASE_APPROVED: ${{ vars.QG_RELEASE_APPROVED }}
        run: python3 tools/release_gate.py "${{ steps.ver.outputs.version }}" "${QG_RELEASE_APPROVED:-false}"

      - name: the package for that version is here and verifies
        run: |
          set -euo pipefail
          P="${{ steps.ver.outputs.package }}"
          test -s "$P" || { echo "::error::$P is missing: a release is published from a verified package, never from a guess"; exit 1; }
          test -s "$P.manifest.json" || { echo "::error::$P.manifest.json is missing"; exit 1; }
          python3 tools/fm1_sign.py verify "$P" --manifest "$P.manifest.json"

      - name: tag the commit, once
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          if git ls-remote --tags origin "refs/tags/$V" | grep -q .; then
            echo "::notice::$V is already tagged; the tag is not moved"
          else
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                tag -a "$V" -m "Quantum GammaWave $V"
            git push origin "refs/tags/$V"
          fi

      - name: the notes, from the changelog entry for this version
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          mkdir -p build
          python3 - "$V" <<'PY' > build/release-notes.md
          import re, sys
          version = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          found = None
          for block in re.split(r"(?m)^## ", text)[1:]:
              if version in block.split("\n", 1)[0]:
                  found = block
                  break
          if found is None:
              sys.exit("no CHANGELOG section names " + version)
          title, _, body = found.partition("\n")
          print("## " + title.strip())
          print()
          print(body.strip())
          print()
          print("**Verify what you download.** The package beside this release is the one `release/felucca-" + version + ".fwsc` holds; `SHA256SUMS` lists its hash and the installer checks it before it enables INSTALL. " + version + " ships unsigned by design: integrity via SHA-256 and the build record, not authenticity.")
          PY
          test -s build/release-notes.md
          head -3 build/release-notes.md

      - name: attest the package that is published
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.ver.outputs.package }}

      - name: publish the release, once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          P="${{ steps.ver.outputs.package }}"
          # (3.1) every asset the release must carry: the package, the manifest that names it, the
          # build record it was made from and the sums. A release created without them -- v3.0.1 was
          # cut by hand -- is repaired here instead of being left empty, and an asset that is already
          # there is never replaced: gh refuses the upload and that is the wanted outcome.
          ASSETS="$P $P.manifest.json release/build-manifest-$V.json release/SHA256SUMS"
          for a in $ASSETS; do
            test -s "$a" || { echo "::error::$a is missing: the release would be incomplete"; exit 1; }
          done
          if gh release view "$V" >/dev/null 2>&1; then
            echo "::notice::release $V already exists; refreshing its notes and adding any missing asset"
            gh release edit "$V" --notes-file build/release-notes.md
            have="$(gh release view "$V" --json assets --jq '.assets[].name' || true)"
            for a in $ASSETS; do
              name="$(basename "$a")"
              case " $have " in
                *" $name "*) echo "asset $name is already attached, left as it is" ;;
                *) gh release upload "$V" "$a" ;;
              esac
            done
            gh release view "$V" --json tagName,isDraft,isPrerelease,assets
            exit 0
          fi
          gh release create "$V" \
            --verify-tag \
            --title "Quantum GammaWave $V" \
            --notes-file build/release-notes.md \
            $ASSETS
          gh release view "$V" --json tagName,isDraft,isPrerelease,assets
