# SPDX-License-Identifier: GPL-3.0-only
# Quantum GammaWave — the tag and the release, created by the runner.
#
# `release.yml` builds and attests on a tag push, but nothing in this repository ever created that tag:
# every release so far needed a person with a credential to push `vX.Y.Z` by hand, which is why a version
# could be served by Pages for hours with no GitHub Release behind it. This job closes that link.
#
# It only publishes what the tree already commits: the package in `release/` that names this version is
# verified against its own manifest first (`fm1_sign.py verify`: hash, size, product, images, build record),
# so a release can never be cut from a guessed or stale artefact. The tag is annotated at the commit that
# carries that package, the package itself is attested, and `gh release create --verify-tag` refuses to
# create a release for a tag that does not exist.
#
# It is idempotent: an existing tag or release is reported and left alone, never moved and never overwritten.
#
# (1.3.7) It also starts the ATTESTED build. A tag pushed with `GITHUB_TOKEN` starts no workflow -- GitHub
# suppresses `push: tags` for it -- so `release.yml`, which builds through the shared zvenson/fm1-build
# workflow and gets "Built from source on GitHub", never ran for a tag this job created: every 1.3.x release
# went out without an attestation. A dispatch is not suppressed, so this job names the tag in
# `release.yml`'s `tag` input once the tag exists. It names it in an input instead of dispatching at the tag
# because a dispatch reads the workflow file AT THE REF IT IS DISPATCHED AT: a tag whose tree predates the
# trigger (v1.3.6 and everything before) would be refused at its own tag, and one run per version has to be
# possible for those too. `release/attest-backfill.txt` lists the tags to repair, so the versions already
# published without an attestation are covered by the next push instead of by hand.
name: tag and publish

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  actions: write        # gh workflow run: the attested build of a tag this job just created

concurrency:
  group: tag-and-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: the version the firmware carries
        id: ver
        run: |
          set -euo pipefail
          V=$(sed -n 's/^#define FELUCCA_VERSION "\([^"]*\)".*/\1/p' firmware/src/felucca.c | head -1)
          case "$V" in
            v[0-9]*) ;;
            *) echo "::error::FELUCCA_VERSION '${V}' is not a release version"; exit 1 ;;
          esac
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "package=release/felucca-${V}.fwsc" >> "$GITHUB_OUTPUT"
          echo "version the tree carries: $V"

      # The 3.0 plan forbids assigning, tagging or publishing it until every phase, the target
      # build and the physical checks are done. This is the one gate both publish paths call;
      # the approval is a repository variable, never a value in the tree.
      - name: a 3.x release needs an explicit approval
        env:
          QG_RELEASE_APPROVED: ${{ vars.QG_RELEASE_APPROVED }}
        run: python3 tools/release_gate.py "${{ steps.ver.outputs.version }}" "${QG_RELEASE_APPROVED:-false}"

      - name: the package for that version is here and verifies
        run: |
          set -euo pipefail
          P="${{ steps.ver.outputs.package }}"
          test -s "$P" || { echo "::error::$P is missing: a release is published from a verified package, never from a guess"; exit 1; }
          test -s "$P.manifest.json" || { echo "::error::$P.manifest.json is missing"; exit 1; }
          python3 tools/fm1_sign.py verify "$P" --manifest "$P.manifest.json"

      - name: tag the commit, once
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          if git ls-remote --tags origin "refs/tags/$V" | grep -q .; then
            echo "::notice::$V is already tagged; the tag is not moved"
          else
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                tag -a "$V" -m "Quantum GammaWave $V"
            git push origin "refs/tags/$V"
          fi

      - name: the notes, from the changelog entry for this version
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          mkdir -p build
          python3 - "$V" <<'PY' > build/release-notes.md
          import re, sys
          version = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          found = None
          for block in re.split(r"(?m)^## ", text)[1:]:
              if version in block.split("\n", 1)[0]:
                  found = block
                  break
          if found is None:
              sys.exit("no CHANGELOG section names " + version)
          title, _, body = found.partition("\n")
          print("## " + title.strip())
          print()
          print(body.strip())
          print()
          print("**Verify what you download.** The package beside this release is the one `release/felucca-" + version + ".fwsc` holds; `SHA256SUMS` lists its hash and the installer checks it before it enables INSTALL. " + version + " ships unsigned by design: integrity via SHA-256 and the build record, not authenticity.")
          PY
          test -s build/release-notes.md
          head -3 build/release-notes.md

      - name: attest the package that is published
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.ver.outputs.package }}

      - name: publish the release, once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          P="${{ steps.ver.outputs.package }}"
          # (3.1) every asset the release must carry: the package, the manifest that names it, the
          # build record it was made from and the sums. A release created without them -- v3.0.1 was
          # cut by hand -- is repaired here instead of being left empty, and an asset that is already
          # there is never replaced: gh refuses the upload and that is the wanted outcome.
          ASSETS="$P $P.manifest.json release/build-manifest-$V.json release/SHA256SUMS"
          for a in $ASSETS; do
            test -s "$a" || { echo "::error::$a is missing: the release would be incomplete"; exit 1; }
          done
          if gh release view "$V" >/dev/null 2>&1; then
            echo "::notice::release $V already exists; refreshing its notes and adding any missing asset"
            gh release edit "$V" --notes-file build/release-notes.md
            # `gh release view --jq` prints one name per line: join them with spaces before matching, or the
            # pattern below never matches an asset that is already there and the upload fails the job (which
            # is what happened to the first two v1.3.7 runs, when the release existed but this step's dedupe
            # could not see it). Names cannot contain spaces, so the joined list is unambiguous.
            have="$(gh release view "$V" --json assets --jq '.assets[].name' | tr '\n' ' ' || true)"
            for a in $ASSETS; do
              name="$(basename "$a")"
              case " $have " in
                *" $name "*)
                  # The package and its manifest are immutable once attached: they are the artefact and
                  # its description, and swapping either would break the attestation. The two DERIVED
                  # files (the sums and the build record) are descriptions of the tree; when the tree's
                  # copy no longer matches the attached one, the release would be publishing sums that
                  # do not describe what it carries (release/SHA256SUMS drifted from 1.3.5 to 1.3.8 and
                  # `signed-release.yml` failed on it). Replace only those, and only on a digest mismatch.
                  case "$name" in
                    SHA256SUMS|build-manifest-*.json)
                      local_sha="$(sha256sum "$a" | cut -d' ' -f1)"
                      remote="$(gh release view "$V" --json assets \
                        --jq ".assets[] | select(.name == \"$name\") | .digest // \"\"" 2>/dev/null || true)"
                      case "$remote" in
                        "sha256:$local_sha") echo "asset $name is attached and matches the tree" ;;
                        sha256:*)
                          echo "::notice::asset $name on $V does not match the tree: replacing the derived copy"
                          gh release delete-asset "$V" "$name" --yes
                          gh release upload "$V" "$a" ;;
                        *) echo "asset $name is already attached, left as it is (no digest to compare)" ;;
                      esac ;;
                    *) echo "asset $name is already attached, left as it is" ;;
                  esac ;;
                *) gh release upload "$V" "$a" ;;
              esac
            done
            gh release view "$V" --json tagName,isDraft,isPrerelease,assets
            exit 0
          fi
          gh release create "$V" \
            --verify-tag \
            --title "Quantum GammaWave $V" \
            --notes-file build/release-notes.md \
            $ASSETS
          gh release view "$V" --json tagName,isDraft,isPrerelease,assets

      # The seeded trigger: `push: tags` is suppressed for a tag pushed with GITHUB_TOKEN, a dispatch is
      # not. Named by version, one run per version (release.yml's `run-name` and `concurrency`), and never
      # started twice: a version already being attested is left to the run in flight and a version already
      # attested is reported, so a re-run of this job costs nothing.
      #
      # It talks to the REST API directly instead of `gh workflow run`: the endpoint takes the workflow file
      # and the ref explicitly, so an error says which of the two was refused, and the push that carries a
      # new trigger can take a few seconds to register -- hence the retries. Everything the step does goes
      # to the run's summary as well as the log, because the log of a failed job needs a credential to read
      # and the summary does not.
      - name: start the attested build for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          OUT=$(mktemp)
          say() { echo "$*" | tee -a "$OUT"; }
          fail=0
          say "attested build: versions named for this push"
          VERSIONS="$VERSION"
          if [ -s release/attest-backfill.txt ]; then
            BACKFILL=$(sed -n 's/^ *\(v[0-9][0-9.]*\) *$/\1/p' release/attest-backfill.txt | tr '\n' ' ')
            say "  backfill list: ${BACKFILL:-none}"
            VERSIONS="$VERSIONS $BACKFILL"
          fi
          for V in $VERSIONS; do
            if ! git ls-remote --tags origin "refs/tags/$V" | grep -q .; then
              say "  $V: not tagged, nothing to attest"
              continue
            fi
            runs=$(gh run list --repo "$REPO" --workflow=release.yml --limit 100 --json name,status,conclusion \
                     --jq "[.[] | select(.name == \"release $V\") | .status + \"/\" + (.conclusion // \"-\")] | join(\" \")" 2>&1)
            case " $runs " in
              *"in_progress"*|*"queued"*|*"requested"*|*"waiting"*|*"pending"*)
                say "  $V: release.yml is already running ($runs), left alone"; continue ;;
              *"completed/success"*)
                say "  $V: release.yml already attested it ($runs), nothing to do"; continue ;;
            esac
            say "  $V: starting release.yml (previous runs: ${runs:-none})"
            ok=0
            for attempt in 1 2 3; do
              err=$(gh api -X POST "repos/$REPO/actions/workflows/release.yml/dispatches" \
                      -f "ref=$REF" -f "inputs[tag]=$V" 2>&1 >/dev/null)
              if [ -z "$err" ]; then say "  $V: dispatched (attempt $attempt)"; ok=1; break; fi
              say "  $V: attempt $attempt refused: $err"
              sleep 15
            done
            [ "$ok" = 1 ] || fail=1
          done
          say ""
          say "release.yml now:"
          gh run list --repo "$REPO" --workflow=release.yml --limit 5 --json name,status,conclusion,url \
            --jq '.[] | "  \(.name)  \(.status)/\(.conclusion // "-")  \(.url)"' 2>&1 | tee -a "$OUT"
          {
            echo "### the attested build for this push"
            echo '```'
            cat "$OUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$fail"
