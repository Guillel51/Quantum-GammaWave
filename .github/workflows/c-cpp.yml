# SPDX-License-Identifier: GPL-3.0-only
# Host tests (no hardware, no JieLi toolchain, no AC79 SDK): every C test in tests/run_tests.sh,
# the generated headers, the sanitizer runs, the Python tools and the web tests.
#   NO_PACKAGE=1  skips the checks that need build/felucca.fwsc / build/loader/ota.bin; the
#                 emulator workflow builds and tests the package with the toolchain.
name: host tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: host-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Python packages (font / icon / table generation)
        run: pip install Pillow numpy fonttools cryptography   # sign_test, key_custody_test and
        # install_test import cryptography; without it the host job died with ModuleNotFoundError

      - name: generated headers (fonts, icons, palettes, shapes, tables, FM6 patches)
        run: python3 -c "import sys; sys.path.insert(0, 'tools'); import build; build.generate()"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: host tests (ASan + UBSan included; package tests skipped)
        run: NO_PACKAGE=1 sh tests/run_tests.sh

      # The external-reader verifier: a simulated chip with a clean pair and every way a dump lies.
      - name: external SPI dump verifier
        run: python3 tests/spi_dump_test.py

      # (phase 5/5) The Firmware Hub reads fmhub.json from main and ignores the WHOLE file if one
      # field is unknown or out of bounds, so a typo costs the card its text silently. Offline here:
      # the links and the picture are checked against the repository, not against the hub's server.
      - name: Hub card (fmhub.json) against the hub's published rules
        run: python3 tools/check_fmhub.py --offline

      # The distributed .syx must be the one this tree generates: a hand-edited bank would be an
      # asset nobody can rebuild.
      - name: the distributed FM6 bank regenerates byte for byte
        run: |
          python3 tools/gen_fm6_patches.py --syx /tmp/gw1-keys.syx
          cmp /tmp/gw1-keys.syx web/banks/gw1-keys.syx
