<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quantum GammaWave — the plan before you write</title>
<style>
  :root { --bg:#0b0d17; --card:#131627; --border:#242a44; --fg:#e8ecf8; --muted:#8f9ab8;
          --accent:#4be3c8; --gold:#ffcf5c; --theme:#59b8ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.55 system-ui,Segoe UI,Roboto,sans-serif; }
  main { max-width:860px; margin:0 auto; padding:28px 18px 60px; }
  h1 { font-size:22px; letter-spacing:.02em; margin:0 0 6px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px 18px; margin:18px 0; }
  .small { font-size:13.5px; }
  .muted { color:var(--muted); }
  dl { display:grid; grid-template-columns:max-content 1fr; gap:4px 14px; margin:12px 0 0; font-size:13.5px; }
  dt { color:var(--muted); } dd { margin:0; }
  #verdict { font-weight:600; margin:12px 0 0; }
  #note { color:var(--muted); font-size:13px; margin:8px 0 0; }
  a { color:var(--accent); }
  button, .btn { background:transparent; color:var(--fg); border:1px solid var(--border); border-radius:8px;
                 padding:7px 12px; font:inherit; cursor:pointer; text-decoration:none; display:inline-block; }
  .btn.primary { background:var(--accent); color:#08211c; border-color:var(--accent); font-weight:700; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:14px; }
  code { font-size:12.5px; }
</style>
</head>
<body>
<main>
  <div class="row" style="justify-content:space-between;margin:0 0 14px">
    <a href="../" class="small">← Quantum GammaWave</a>
    <button id="lang" type="button" class="small">ES</button>
  </div>
  <h1 data-t="title"></h1>
  <p class="small" data-t="lead"></p>

  <section class="card">
    <p class="small" id="pkgline"></p>
    <p class="small"><label><span data-t="dump"></span> <input id="dump" type="file" accept=".bin,application/octet-stream"></label></p>
    <p class="small" data-t="checks" style="margin:14px 0 0;font-weight:600"></p>
    <dl id="rows"></dl>
    <p id="verdict"></p>
    <p id="note"></p>
  </section>

  <div class="row">
    <a class="btn primary" id="next" href="../webapp/installer/"></a>
  </div>
  <p class="small muted" data-t="foot" style="margin-top:16px"></p>
</main>
<script type="module">
/*LIB*/
const $ = (id) => document.getElementById(id);
const PT = {
  en: {
    title: "The plan before you write",
    lead: "Your dump and the package this site serves, and the sectors the installer will erase. This page runs the same checks on the package that the installer runs and plans the write from your bytes; nothing is sent to the unit and nothing is written from here.",
    dump: "Your dump (.bin, 1 MiB):",
    checks: "The installer's checks on this package",
    pkgline: "package",
    next: "Continue to the installer",
    foot: "The install itself is the installer's. On a stock unit it stages this package's loader, which reads the flash chip and refuses a part the firmware does not write before erasing anything; it writes only what differs inside 0x04000–0x92FFF and keeps the boot area and the factory data.",
    accContainer: "package (identity)", accImage: "flash image", accHeaderCrc: "header CRC16",
    accListCrc: "files in the list", accFlashCrc: "flash.bin CRC16", accModel: "model",
    accSize: "fits the 1 MiB part", accAppFile: "app file, decrypted, CRC16", accKey: "chip key",
    accRange: "write range", accSectors: "sectors", accBoot: "boot area kept", accFactory: "factory data",
    refuseContainer: "The installer refuses this package:", refuseModel: "The installer refuses this package — another model:",
    refuseSize: "The installer refuses this package — larger than the flash:",
    refuseKey: "The installer refuses this package — its firmware does not decrypt with the unit's chip key:",
    refuseFactory: "The installer refuses this package — it reaches the factory data:",
    bound: "At most %n sectors: the whole app area. Load your dump for the exact plan.",
    exact: "Writes %n sectors (%k KiB): %r",
    unchanged: "The other %n sectors already match and are left alone.",
    badDump: "That file is %n B: a dump of this unit is 1048576 B. Not used.",
    badPkg: "The release package could not be loaded or does not match its published SHA-256.",
    note: "What this cannot say: what your unit will answer when the installer opens it — it identifies the model and the chip key again before writing.",
  },
  es: {
    title: "El plan antes de escribir",
    lead: "Tu dump y el paquete que sirve este sitio, y los sectores que va a borrar el instalador. Esta página corre sobre el paquete las mismas comprobaciones que hace el instalador y planifica la escritura con tus bytes; no se envía nada a la unidad y desde acá no se escribe nada.",
    dump: "Tu dump (.bin, 1 MiB):",
    checks: "Las comprobaciones del instalador sobre este paquete",
    pkgline: "paquete",
    next: "Seguir al instalador",
    foot: "La instalación la hace el propio instalador. En una unidad de fábrica prepara el loader de este paquete, que lee el chip de flash y rechaza una parte que el firmware no escribe antes de borrar nada; escribe sólo lo que difiere dentro de 0x04000–0x92FFF y conserva el área de arranque y los datos de fábrica.",
    accContainer: "paquete (identidad)", accImage: "imagen de flash", accHeaderCrc: "CRC16 de cabecera",
    accListCrc: "ficheros en la lista", accFlashCrc: "CRC16 de flash.bin", accModel: "modelo",
    accSize: "entra en la parte de 1 MiB", accAppFile: "fichero de la app, descifrado, CRC16", accKey: "chip key",
    accRange: "rango de escritura", accSectors: "sectores", accBoot: "área de arranque conservada",
    accFactory: "datos de fábrica",
    refuseContainer: "El instalador rechaza este paquete:", refuseModel: "El instalador rechaza este paquete — es de otro modelo:",
    refuseSize: "El instalador rechaza este paquete — es más grande que el flash:",
    refuseKey: "El instalador rechaza este paquete — su firmware no descifra con la chip key de la unidad:",
    refuseFactory: "El instalador rechaza este paquete — llega a los datos de fábrica:",
    bound: "Como máximo %n sectores: toda el área de aplicación. Cargá tu dump para el plan exacto.",
    exact: "Escribe %n sectores (%k KiB): %r",
    unchanged: "Los otros %n sectores ya coinciden y no se tocan.",
    badDump: "Ese archivo tiene %n B: el dump de esta unidad es de 1048576 B. No se usó.",
    badPkg: "No se pudo cargar el paquete del release, o no coincide con su SHA-256 publicado.",
    note: "Lo que esto no puede decir: qué va a contestar tu unidad cuando la abra el instalador — vuelve a identificar el modelo y la chip key antes de escribir.",
  },
};
let lang = (() => { try { return localStorage.getItem("qg-plan-lang") === "es" ? "es" : "en"; } catch (_) { return "en"; } })();
const t = (k) => (PT[lang] && PT[lang][k]) || PT.en[k] || k;
const fill = (s, m) => Object.keys(m).reduce((a, k) => a.split("%" + k).join(m[k]), s);
let pkg = null, pkgBytes = null;

function paint() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach((e) => { e.textContent = t(e.dataset.t); });
  $("lang").textContent = lang === "en" ? "ES" : "EN";
  $("next").textContent = t("next");
  if (pkgBytes) $("pkgline").textContent = `${t("pkgline")}: ${acceptance(pkgBytes).product} · ${pkgBytes.length} B · sha256 ${pkgHash.slice(0, 16)}…`;
  render();
}

let pkgHash = "", dump = null;
function render() {
  const rows = $("rows"), verdict = $("verdict"), note = $("note");
  rows.textContent = "";
  if (!pkgBytes) { verdict.textContent = t("badPkg"); note.textContent = ""; return; }
  const acc = acceptance(pkgBytes);
  const add = (label, value) => {
    const dt = document.createElement("dt"); dt.textContent = label;
    const dd = document.createElement("dd"); dd.textContent = value;
    rows.append(dt, dd);
  };
  for (const c of acc.checks) add(t(c.key), c.value);
  if (!acc.ok) {
    verdict.textContent = "\u2717 " + t(acc.refusal.key) + " " + acc.refusal.value;
    verdict.style.color = "var(--gold)"; note.textContent = "";
    return;
  }
  verdict.style.color = "";
  const plan = sectorPlan(acc.pkg, dump);
  if (plan.badDump) {
    verdict.textContent = "\u2717 " + fill(t("badDump"), { n: plan.badDump });
    verdict.style.color = "var(--gold)"; note.textContent = "";
    return;
  }
  if (!plan.exact) {
    verdict.textContent = "\u25CB " + fill(t("bound"), { n: plan.bound });
    note.textContent = t("note");
    return;
  }
  verdict.style.color = "var(--accent)";
  const runs = plan.runs.length ? plan.runs.map(hexRange).join(", ") : "\u2014";
  verdict.textContent = "\u2713 " + fill(t("exact"), { n: plan.sectors.length,
    k: (plan.sectors.length * ACCEPT_SECTOR / 1024).toFixed(0), r: runs });
  note.textContent = (plan.unchanged ? fill(t("unchanged"), { n: plan.unchanged }) + " " : "") + t("note");
}

$("dump").addEventListener("change", async (ev) => {
  const f = ev.target.files && ev.target.files[0];
  dump = f ? new Uint8Array(await f.arrayBuffer()) : null;
  render();
});
$("lang").addEventListener("click", () => {
  lang = lang === "en" ? "es" : "en";
  try { localStorage.setItem("qg-plan-lang", lang); } catch (_) {}
  paint();
});

/* the package this site serves: its own versions.json names the file and the SHA-256 published with it,
   and the bytes are hashed here before any check runs on them */
(async () => {
  try {
    /* versions.json names the file beside it and its SHA-256; the path is built from the same base (the
       `pkg` field in there is relative to the installer page, which is not where this page lives) */
    let done = false;
    for (const base of ["../firmware/"]) {
      const vres = await fetch(base + "versions.json");
      if (!vres.ok) continue;
      const versions = await vres.json();
      const v = versions[0];
      if (!v || !v.file) continue;
      const r = await fetch(base + v.file);
      if (!r.ok) throw new Error(`${base}${v.file}: HTTP ${r.status}`);
      const bytes = new Uint8Array(await r.arrayBuffer());
      const hash = await sha256hex(bytes);
      if (v.sha256 && hash !== v.sha256) throw new Error("sha256 mismatch");
      pkgHash = hash; pkgBytes = bytes;
      paint();
      done = true;
      break;
    }
    if (!done) throw new Error("no release channel");
  } catch (e) {
    pkgBytes = null; paint();
    $("verdict").textContent = "\u2717 " + t("badPkg") + " (" + (e && e.message) + ")";
    $("verdict").style.color = "var(--gold)";
  }
})();
</script>
</body>
</html>
